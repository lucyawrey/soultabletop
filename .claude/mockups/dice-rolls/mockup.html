<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dice Rolls Mockup</title>
<script src="../_kit/app-theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
/* Sheet tokens, as app/assets/css/main.css maps them (same as the PF2e frozen sheet). */
:root {
  --st-page: var(--color-folio-100); --st-panel: var(--ui-bg); --st-panel-muted: var(--ui-bg-elevated);
  --st-ink: var(--ui-text-highlighted); --st-ink-muted: var(--ui-text-muted);
  --st-primary: var(--ui-primary); --st-on-primary: var(--ui-text-inverted); --st-accent: var(--ui-secondary);
  --st-border: var(--ui-border); --st-border-strong: var(--ui-border-accented);
  --st-radius: calc(var(--ui-radius) * 1.5);
  --st-font-body: var(--font-sans); --st-font-display: var(--font-display);
}
body { margin: 0; background: var(--st-page); color: var(--st-ink); font-family: var(--st-font-body); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--st-primary); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Mockup chrome (not part of the design). */
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 16px; background: var(--st-panel); border-bottom: 1px solid var(--st-border); position: sticky; top: 0; z-index: 5; }
.bar b { font-family: var(--st-font-display); font-size: 20px; }
.bar small { color: var(--st-ink-muted); }
.ctl { display: inline-flex; border: 1px solid var(--st-border-strong); border-radius: 6px; overflow: hidden; }
.ctl[hidden] { display: none; }
.ctl button { font-size: 13px; padding: 4px 10px; border: 0; background: transparent; cursor: pointer; }
.ctl button[aria-pressed="true"] { background: var(--st-primary); color: var(--st-on-primary); font-weight: 700; }
.contrast { position: fixed; top: 52px; right: 16px; z-index: 30; font-size: 12px; color: var(--st-ink-muted); background: var(--st-panel); border: 1px solid var(--st-border-strong); border-radius: 6px; padding: 8px 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .15); }
.contrast[hidden] { display: none; }
.contrast td { padding: 1px 8px 1px 0; }

/* Page: the content page's header, then the sheet (and the Recent rolls panel when that option is on). */
.page { max-width: 1180px; margin: 0 auto; padding: 12px 12px 120px; }
.layout { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
.page[data-recent="panel"] { max-width: 1500px; }
@media (min-width: 1100px) { .page[data-recent="panel"] .layout { grid-template-columns: 1fr 340px; } .page[data-recent="panel"] .rolls-btn { display: none; } }
@media (max-width: 1099px) { .page[data-recent="panel"] .panel { display: none; } }
.panel { position: sticky; top: 64px; max-height: calc(100vh - 80px); display: flex; flex-direction: column; }

/* Sheet (compact density from the frozen PF2e sheet). */
.sheet { --d-gap: 6px; --d-pad: 8px; --d-h: 24px; --d-fs: 13px; --d-lfs: 10.5px; --d-big: 22px; --d-hero: 30px; --d-h2: 15px;
  padding: calc(var(--d-gap) + 10px) 0 var(--d-gap); display: grid; gap: calc(var(--d-gap) + 10px) var(--d-gap); font-size: var(--d-fs); min-width: 0;
  grid-template-columns: minmax(300px, 1fr) 1.5fr; grid-template-areas: "head head" "skills right"; align-items: start; }
.sheet > .head-section { grid-area: head; } .sheet > .skills { grid-area: skills; } .sheet > .right { grid-area: right; display: grid; gap: calc(var(--d-gap) + 10px); min-width: 0; }
.sheet-section { position: relative; background: var(--st-panel); border: 1px solid var(--st-border); border-radius: var(--st-radius); padding: calc(var(--d-pad) + 6px) var(--d-pad) var(--d-pad); min-width: 0; }
.sheet-section > h2 { position: absolute; white-space: nowrap; top: 0; left: var(--d-pad); transform: translateY(-55%); margin: 0; font-family: var(--st-font-display); font-size: var(--d-h2); line-height: 1; padding: 3px 10px 4px; background: var(--st-panel); border: 1px solid var(--st-border-strong); border-bottom-color: var(--st-panel); border-radius: calc(var(--st-radius) * .8) calc(var(--st-radius) * .8) 0 0; }
.sheet-section > .aside { position: absolute; top: 0; right: var(--d-pad); transform: translateY(-50%); font-size: var(--d-lfs); color: var(--st-ink-muted); font-weight: 700; background: var(--st-panel); padding: 0 6px; }
.head-section { padding-top: var(--d-pad); }
.sheet-field-label { font-size: var(--d-lfs); color: var(--st-ink-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.sheet-field-value { font-weight: 700; font-variant-numeric: tabular-nums; }
.dim { color: var(--st-ink-muted); font-weight: 400; }
.small { font-size: var(--d-lfs); }
.head { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; }
.head h1 { font-family: var(--st-font-display); font-size: calc(var(--d-big) * 1.35); margin: 0; line-height: 1; }
.head .who { display: grid; gap: 2px; }
.head .live { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-left: auto; }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips button { width: 17px; height: 17px; border: 1.5px solid var(--st-primary); border-radius: 50%; background: transparent; padding: 0; cursor: pointer; }
.pips button.on { background: var(--st-primary); }
.pips button:disabled { cursor: default; }
.toggle { display: inline-flex; align-items: center; gap: 6px; height: calc(var(--d-h) + 4px); padding: 0 12px; border: 1px solid var(--st-primary); border-radius: calc(var(--st-radius) * .66); background: var(--st-panel); color: var(--st-primary); font-weight: 700; cursor: pointer; }
.toggle[aria-pressed="true"] { background: var(--st-primary); color: var(--st-on-primary); }
.toggle:disabled { cursor: default; }
.toggle .mark { width: 1em; text-align: center; }
.rank { display: inline-grid; place-items: center; width: 20px; height: 17px; border-radius: 4px; font-size: 10.5px; font-weight: 700; border: 1px solid var(--st-border-strong); color: var(--st-ink-muted); }
.rank.t, .rank.e { background: var(--st-primary); color: var(--st-on-primary); border-color: var(--st-primary); }
.act { color: var(--st-primary); font-weight: 700; font-size: 1.45em; line-height: 1; }
.link { color: var(--st-ink); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

/* Defenses */
.defs { display: grid; grid-template-columns: 110px 1fr; gap: var(--d-gap); }
.box { border: 1px solid var(--st-border-strong); border-radius: var(--st-radius); padding: calc(var(--d-pad) * .6); text-align: center; background: var(--st-panel); display: grid; gap: 2px; align-content: center; position: relative; }
.box.key { border: 2px solid var(--st-primary); }
.box .big { font-size: var(--d-hero); font-weight: 700; line-height: 1.05; }
.saves { text-align: left; align-content: start; }
.saves .srows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 16px; }
.saves .srow { display: grid; grid-template-columns: 1fr auto 22px; align-items: center; gap: 6px; }

/* Rows */
.rows { display: grid; }
.row { display: grid; align-items: center; gap: 6px; min-height: var(--d-h); border-bottom: 1px solid var(--st-border); padding: calc(var(--d-gap) * .3) 0; }
.row:last-child { border-bottom: 0; }
.row.th { min-height: 0; } .row.th > * { font-size: var(--d-lfs); color: var(--st-ink-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.row.untrained > span:first-child { color: var(--st-ink-muted); }
.skills .row { grid-template-columns: 1fr 30px 22px 70px; }
.skills .row > :last-child { justify-self: end; }
.skills .lead > b { font-family: var(--st-font-display); font-size: var(--d-h2); }
.skills .init { border-bottom: 2px solid var(--st-border-strong); margin-bottom: calc(var(--d-gap) * .5); }
.skills .rows + .rows { border-top: 1px solid var(--st-border); }
.strikes .row { grid-template-columns: 30px 1fr 190px 1fr; }
.strikes .row.has-traits { grid-template-rows: auto auto; }
.strikes .traits { grid-column: 2 / -1; font-size: var(--d-lfs); color: var(--st-ink-muted); margin-top: -2px; }
.hitcell { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mapcell { display: inline-flex; gap: 8px; font-size: var(--d-lfs); }
.dmgcell { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }

/* Rollable values: the three roll-target options. */
.mod { font-weight: 700; font-variant-numeric: tabular-nums; background: none; border: 0; padding: 0 2px; cursor: pointer; border-bottom: 1px dotted var(--st-border-strong); }
.rt { display: inline-flex; align-items: center; gap: 4px; }
.dbtn { width: 22px; height: 22px; display: inline-grid; place-items: center; border: 1px solid var(--st-border-strong); border-radius: 5px; background: var(--st-panel); color: var(--st-primary); cursor: pointer; padding: 0; flex: none; }
.dbtn svg { width: 17px; height: 17px; }
.dbtn:hover { background: var(--st-primary); color: var(--st-on-primary); border-color: var(--st-primary); }
.roll-u { font-weight: 700; font-variant-numeric: tabular-nums; background: none; border: 0; border-bottom: 2px solid var(--st-primary); color: var(--st-primary); padding: 0 2px; cursor: pointer; line-height: 1.2; }
.roll-u:hover { background: color-mix(in srgb, var(--st-primary) 12%, transparent); }
.roll-u.minor { border-bottom-width: 1px; border-bottom-style: dashed; }
.roll-h { position: relative; font-weight: 700; font-variant-numeric: tabular-nums; background: none; border: 0; padding: 0 3px; border-radius: 4px; cursor: pointer; line-height: 1.3; }
.roll-h .hi { position: absolute; right: 100%; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; margin-right: 1px; color: var(--st-primary); opacity: 0; pointer-events: none; }
.roll-h:hover, .roll-h:focus-visible { background: color-mix(in srgb, var(--st-primary) 14%, transparent); color: var(--st-primary); }
.roll-h:hover .hi, .roll-h:focus-visible .hi { opacity: 1; }
.mathpop { position: absolute; z-index: 7; max-width: min(360px, calc(100vw - 16px)); font-size: 11.5px; color: var(--st-ink-muted); background: var(--st-panel); border: 1px solid var(--st-border-strong); border-radius: 6px; padding: 4px 8px; box-shadow: 0 6px 18px rgb(0 0 0 / .14); }
.mathpop[hidden] { display: none; }
.mathpop b { color: var(--st-ink); }

/* Dice: simple outlined shapes (inline SVG), one stroke width and rounded joins for every die. */
.die { --sz: 30px; width: var(--sz); height: var(--sz); position: relative; display: inline-grid; place-items: center; flex: none; font-weight: 800; font-variant-numeric: tabular-nums; font-size: calc(var(--sz) * .36); color: var(--st-ink); }
.die svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.die svg * { fill: var(--st-panel); stroke: var(--st-primary); stroke-width: 2px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.die b { position: relative; z-index: 1; line-height: 1; }
.die.d4 b { transform: translateY(20%); font-size: .85em; }
.die.d10 b { transform: translateY(-10%); }
.die.d12 b { transform: translateY(8%); }
.die.two b { font-size: .86em; letter-spacing: -.02em; }
.die.nat svg * { fill: var(--st-primary); } .die.nat b { color: var(--st-on-primary); }
/* A fumble face: a dashed outline in the error color (not color alone) over a faint tint. */
.die.fumble svg * { fill: color-mix(in srgb, var(--ui-error) 8%, var(--st-panel)); stroke: var(--ui-error); stroke-dasharray: 5 3; }
.die.fumble b { color: var(--ui-error); }
.die.dropped svg * { fill: var(--st-panel-muted); stroke: var(--st-border-strong); }
.die.dropped b, .gdie.dropped b { color: var(--st-ink-muted); text-decoration: line-through; text-decoration-thickness: 2px; }
/* Dice: game-icons.net, with the face on a badge (a d6 shows its pips instead). */
.gdie { --sz: 30px; width: var(--sz); height: var(--sz); position: relative; display: inline-grid; place-items: center; flex: none; color: var(--st-ink); }
.gdie svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.gdie b { position: relative; z-index: 1; min-width: 56%; height: 56%; padding: 0 2px; box-sizing: border-box; display: grid; place-items: center; border-radius: 999px; background: var(--st-panel); box-shadow: 0 0 0 1.5px var(--st-ink); font-weight: 800; font-size: calc(var(--sz) * .34); line-height: 1; font-variant-numeric: tabular-nums; }
.gdie.nat { color: var(--st-primary); } .gdie.nat b { box-shadow: 0 0 0 1.5px var(--st-primary); }
.gdie.dropped { color: var(--st-border-strong); } .gdie.dropped b { box-shadow: 0 0 0 1.5px var(--st-border-strong); }
.dlabel { display: grid; justify-items: center; gap: 1px; }
.dlabel small { font-size: 9.5px; color: var(--st-ink-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.dicerow { display: flex; flex-wrap: wrap; align-items: end; gap: 6px 8px; }
.dicerow .op { color: var(--st-ink-muted); font-weight: 700; align-self: center; }
.dicerow .flat { font-weight: 800; font-variant-numeric: tabular-nums; align-self: center; }
.big .die, .big .gdie { --sz: 40px; }
.big .many .die, .big .many .gdie { --sz: 30px; }
/* A group of dice from one term (2d6) sits close together, captioned when the roll has more than one die. */
.dgroup { display: inline-grid; justify-items: center; gap: 2px; }
.dgroup > span:first-child { display: inline-flex; flex-wrap: wrap; align-items: end; gap: 3px; }

.dgroup > small { font-size: 10.5px; font-weight: 700; color: var(--st-ink-muted); letter-spacing: .02em; }
.shapes { display: grid; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--st-border); }
.shaperow { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 16px; }
.shaperow > .sheet-field-label { width: 64px; align-self: center; }
.dicerow .rtotal { display: inline-flex; align-items: center; gap: 8px; align-self: center; }
.dicerow .rtotal .eq { color: var(--st-ink-muted); font-size: 20px; }
.dicerow .rtotal b { font-family: var(--st-font-display); font-weight: 700; font-size: 44px; line-height: .9; font-variant-numeric: lining-nums tabular-nums; }

/* Roll entries (toast and Recent rolls). */
.entry { display: grid; gap: 4px; padding: 8px 10px; font-size: 13px; }
.ehead { display: flex; align-items: baseline; gap: 6px; }
.ehead .eact { font-weight: 700; }
.ehead .elbl { color: var(--st-ink-muted); }
.ehead time { margin-left: auto; font-size: 11.5px; color: var(--st-ink-muted); white-space: nowrap; }
.ebody { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.etotal { font-family: var(--st-font-display); font-weight: 700; font-size: 26px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; min-width: 1.4em; }
.toast .etotal { font-size: 36px; }
.eexpr { font-variant-numeric: tabular-nums; }
.eexpr .dim { white-space: nowrap; }
.natb { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border-radius: 4px; padding: 1px 6px; border: 1px solid var(--st-primary); color: var(--st-primary); white-space: nowrap; }
.natb.n20 { background: var(--st-primary); color: var(--st-on-primary); }
.emeta { display: grid; grid-template-columns: max-content 1fr; gap: 1px 10px; font-size: 11.5px; color: var(--st-ink-muted); }
.emeta b { color: var(--st-ink); font-weight: 600; }
.rlist .die, .stack .die { --sz: 24px; }
.efoot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.efoot .efu { margin-top: 0; }
.more { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--st-ink-muted); background: none; border: 0; padding: 2px 4px; cursor: pointer; border-radius: 4px; }
.more:hover { color: var(--st-ink); text-decoration: underline; }
.more .chev { display: inline-block; transition: transform .15s; }
.more[aria-expanded="true"] .chev { transform: rotate(90deg); }
.efu { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.fu { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 9px; border: 1px solid var(--st-primary); border-radius: 999px; background: var(--st-panel); color: var(--st-primary); cursor: pointer; }
.fu:hover { background: var(--st-primary); color: var(--st-on-primary); }
.fu .wr { font-size: 10.5px; font-weight: 600; }
.fu.used { border-style: dashed; }
.efrom { font-size: 11.5px; color: var(--st-ink-muted); }
.efrom b { color: var(--st-ink); font-weight: 600; }
.child { border-left: 3px solid var(--st-border-strong); }

/* Result looks. */
.toasts { position: fixed; z-index: 20; width: min(380px, calc(100vw - 16px)); display: grid; gap: 8px; max-height: calc(100vh - 32px); }
.toasts[data-pos="br"] { right: 16px; bottom: 16px; }
.toasts[data-pos="tc"] { top: 16px; left: 50%; transform: translateX(-50%); }
@media (max-width: 640px) { .toasts[data-pos="br"] { right: 8px; bottom: 8px; } .toasts[data-pos="tc"] { top: 8px; } }
.toast { position: relative; overflow: hidden; }
.toast .rcard { border-radius: inherit; }
.stackhead .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border: 0; background: none; cursor: pointer; color: var(--st-ink-muted); font-size: 18px; line-height: 1; border-radius: 4px; }
/* Toasts persist, so their close button is more prominent (site-wide: Nuxt UI's toast close in app.config). */
.toast .x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 1px solid var(--st-border-strong); background: var(--st-panel); cursor: pointer; color: var(--st-ink); font-size: 20px; line-height: 1; border-radius: 6px; }
.toast .x:hover { background: var(--st-panel-muted); border-color: var(--st-ink-muted); }
.toast .entry { padding-right: 40px; }
.stack { display: grid; gap: 0; overflow: auto; max-height: 55vh; }
.stackhead { position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--st-ink-muted); }
.stackhead .x { top: 1px; }
.stack .entry + .entry, .rlist .entry + .entry { border-top: 1px solid var(--st-border); }
.rcard { overflow: hidden; }
.rcard .chead { display: flex; align-items: baseline; gap: 6px; padding: 8px 40px 8px 12px; background: var(--st-panel-muted); border-bottom: 1px solid var(--st-border); }
.rcard .cbody { display: grid; justify-items: center; gap: 8px; padding: 14px 12px 10px; }
.rcard .csum { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.rcard .csum .eq { color: var(--st-ink-muted); font-size: 20px; }
.rcard .ctotal { font-family: var(--st-font-display); font-weight: 700; font-size: 52px; line-height: .9; font-variant-numeric: lining-nums tabular-nums; }
/* Dice card: the card's header band and footer, with the dice and the total on one row. */
.bcard .bbody { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 8px; padding: 10px 12px 8px; }
.bcard .bbody .dicerow { min-width: 0; }
.bcard .btotal { display: flex; align-items: center; gap: 8px; }
.bcard .btotal .eq { color: var(--st-ink-muted); font-size: 20px; }
.bcard .btotal b { font-family: var(--st-font-display); font-weight: 700; font-size: 44px; line-height: .9; font-variant-numeric: lining-nums tabular-nums; }
.bcard .bline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 0 12px 8px; }
.rcard .cfoot { display: grid; gap: 6px; padding: 8px 12px 10px; border-top: 1px solid var(--st-border); }
@media (prefers-reduced-motion: no-preference) {
  .tumble { animation: tumble .85s cubic-bezier(.2, .7, .3, 1) both; }
  @keyframes tumble { 0% { transform: translate(-36px, -18px) rotate(-280deg) scale(.6); opacity: .2; } 55% { transform: translate(4px, 2px) rotate(24deg) scale(1.05); opacity: 1; } 78% { transform: rotate(-8deg); } 100% { transform: none; } }
  .settle { animation: settle .35s ease-out both; }
  @keyframes settle { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: none; opacity: 1; } }
  .flipin { animation: flipin .45s cubic-bezier(.2, .8, .3, 1) both; transform-origin: 50% 0; }
  @keyframes flipin { 0% { transform: perspective(700px) rotateX(-80deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .slidein { animation: slidein .25s ease-out both; }
  @keyframes slidein { 0% { transform: translateY(12px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .drawer .sheetpanel { animation: drawerin .2s ease-out both; }
  @keyframes drawerin { 0% { transform: translateX(40px); opacity: .4; } 100% { transform: none; opacity: 1; } }
}
.pending { visibility: hidden; }

/* Recent rolls drawer */
.drawer { position: fixed; inset: 0; z-index: 25; display: flex; justify-content: flex-end; background: rgb(23 18 27 / .35); }
.drawer[hidden] { display: none; }
.drawer .sheetpanel { width: min(400px, 100vw); height: 100%; display: flex; flex-direction: column; }
.rlist { overflow: auto; flex: 1; }
.rhead { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--st-border); }
.rhead h2 { font-family: var(--st-font-display); font-size: 20px; margin: 0; }
.rhead .sp { flex: 1; }

@media (max-width: 900px) {
  .sheet { grid-template-columns: 1fr; grid-template-areas: "head" "right" "skills"; }
  .defs { grid-template-columns: 90px 1fr; }
  .saves .srows { grid-template-columns: 1fr; }

    ${diceInToast ? diceRow(e.terms, anim) : ""}

      <span class="eexpr">${expr(e.terms)}</span>${natBadge(e)}</div>
    ${!toast ? diceRow(e.terms) : ""}
    ${exp ? `<div id="more${e.id}">${metaHTML(e)}</div>` : ""}
    ${toast ? fuButtons(e) : `<div class="efoot">${fuButtons(e)}<button class="more" data-more="${e.id}" aria-expanded="${exp}" aria-controls="more${e.id}"><span class="chev" aria-hidden="true">›</span>Details</button></div>`}</article>`;
}
// The Card look: the dice and the sum laid out, then the total.
function cardHTML(e, anim) {
  return `<div class="rcard${anim ? " flipin" : ""}" data-impl="new: RollCard">
    <div class="chead"><span class="eact" style="font-weight:700">${e.action}</span><span class="elbl" style="color:var(--st-ink-muted)">${e.label}</span><time style="margin-left:auto;font-size:11.5px;color:var(--st-ink-muted)">${time(e.when)}</time></div>
    <div class="cbody big">${fromLine(e)}${diceRow(e.terms)}
      <div class="csum"><span class="eexpr dim">${expr(e.terms)}</span><span class="eq">=</span><span class="ctotal${anim ? " settle" : ""}" style="${anim ? "animation-delay:.3s" : ""}" data-total>${e.total}</span></div>${natBadge(e)}</div>
    <div class="cfoot"><div class="efrom">${e.path} · ${e.who}</div>${fuButtons(e)}</div></div>`;
}

// The Dice card look: the card's header and footer, the dice tumbling in on one row with the total.
function blendHTML(e, anim) {
  return `<div class="rcard bcard${anim ? " slidein" : ""}" data-impl="new: RollCard (compact)">
    <div class="chead"><span class="eact" style="font-weight:700">${e.action}</span><span class="elbl" style="color:var(--st-ink-muted)">${e.label}</span><time style="margin-left:auto;font-size:11.5px;color:var(--st-ink-muted)">${time(e.when)}</time></div>
    ${e.from ? `<div style="padding:6px 12px 0">${fromLine(e)}</div>` : ""}
    <div class="bbody big">${diceRow(e.terms, anim, `<span class="rtotal"><span class="eq">=</span><b class="${anim ? "pending" : ""}" data-total>${e.total}</b></span>`)}</div>
    <div class="bline"><span class="eexpr dim">${expr(e.terms)}</span>${natBadge(e)}</div>
    ${followUps(e).length ? `<div class="cfoot">${fuButtons(e)}</div>` : ""}</div>`;
}

// ---- Toast, stack, panel, drawer ----
let toastTimer = null, numTimer = null;
S.fresh = null;
const panelShown = () => S.recent === "panel" && matchMedia("(min-width: 1100px)").matches;
function show(e) {
  S.toastId = panelShown() ? null : e.id; S.stackOpen = true; S.fresh = e.id;
  document.getElementById("live").textContent = `${e.action}, ${e.label}: ${e.total} (${expr(e.terms)}, rolled ${expr(e.terms, true)}${e.nat ? `, natural ${e.nat}` : ""}).`;
  renderToasts(true); renderRolls(true);
}
function renderToasts(anim = false) {
  const box = document.getElementById("toasts"); box.dataset.pos = S.toast;
  clearTimeout(toastTimer); clearInterval(numTimer);
  const e = S.toastId && byId(S.toastId);
  if (!e || (S.recent === "stack" && !S.stackOpen)) { box.innerHTML = ""; return; }
  anim = anim && !REDUCED;
  const body = S.look === "card" ? cardHTML(e, anim) : S.look === "blend" ? blendHTML(e, anim) : entryHTML(e, { toast: true, anim });
  const toast = `<div class="toast bg-default ring ring-accented rounded-lg shadow-lg${anim && S.look !== "card" && S.look !== "blend" ? " slidein" : ""}" data-impl="new: RollToast (UToast-style)">${body}
    <button class="x" data-closetoast aria-label="Close" title="Close" data-impl="app.config toast slots.close: UButton color=neutral variant=outline size=sm icon=i-lucide-x">×</button></div>`;
  let stack = "";
  if (S.recent === "stack") {
    const older = ENTRIES.filter(x => x.id !== e.id);
    stack = older.length ? `<div class="bg-default ring ring-accented rounded-lg shadow-lg" data-impl="new: RecentRolls (stack)"><div class="stackhead">Recent rolls · ${older.length}</div>
      <div class="stack">${older.map(x => entryHTML(x)).join("")}</div></div>` : "";
  }
  box.innerHTML = toast + stack;
  if (anim) animate(box, e);
  // The roll toast persists (Nuxt UI toaster, one toast id "roll", duration Infinity): the next roll replaces it, × closes it.
}
function animate(box, e) {
  if (!e || REDUCED) return;
  if (S.look === "number") {
    const el = box.querySelector("[data-total]"), [lo, hi] = range(e.terms), t0 = performance.now();
    numTimer = setInterval(() => { if (performance.now() - t0 > 700) { clearInterval(numTimer); el.textContent = e.total; el.classList.add("settle"); return; }
      el.textContent = lo + Math.floor(Math.random() * (hi - lo + 1)); }, 45);
  }
  if (S.look === "dice" || S.look === "blend") setTimeout(() => { const el = box.querySelector("[data-total]"); if (el) { el.classList.remove("pending"); el.classList.add("settle"); } }, 750);
}
function listHTML(anim = false) {
  return `<div class="rhead"><h2>Recent rolls</h2><span class="sp"></span>
    ${ENTRIES.length ? `<button class="text-sm text-muted underline" data-clear>Clear</button>` : ""}
    ${S.recent === "drawer" || S.drawer ? `<button class="x" data-closedrawer aria-label="Close" style="border:0;background:none;font-size:20px;cursor:pointer;color:var(--st-ink-muted)">×</button>` : ""}</div>
    <div class="rlist">${ENTRIES.length ? ENTRIES.map((e, i) => i === 0 && S.recent === "panel" && !S.drawer && panelShown() ? newestHTML(e, anim && S.fresh === e.id && !REDUCED) : entryHTML(e)).join("") : `<p class="text-sm text-muted p-4">No rolls yet.</p>`}</div>`;
}
// The newest entry at the top of the panel, in the chosen result look.
function newestHTML(e, anim) {
  return `<div class="bg-elevated">${S.look === "card" ? cardHTML(e, anim) : S.look === "blend" ? blendHTML(e, anim) : entryHTML(e, { toast: true, anim })}</div>`;
}
function renderRolls(anim = false) {
  document.getElementById("page").dataset.recent = S.recent;
  document.getElementById("rollscount").textContent = ENTRIES.length ? `(${ENTRIES.length})` : "";
  const panel = document.getElementById("panel");
  panel.hidden = S.recent !== "panel"; if (S.recent === "panel") { panel.innerHTML = listHTML(anim); if (anim) animate(panel, byId(S.fresh)); }
  const dr = document.getElementById("drawer");
  dr.hidden = !S.drawer; if (S.drawer) dr.firstElementChild.innerHTML = listHTML();
}

// ---- Roll targets ----
const ROLLS = {}, PARTS = {};
// A rollable value. noBreakdown: values with nothing to open (MAP steps) roll on click even with the Die icon option.
function target(id, text, label, parts, make, { noBreakdown = false, minor = false } = {}) {
  ROLLS[id] = make; PARTS[id] = parts;
  const icon = svg("rolling-dices");
  if (S.target === "icon" && !noBreakdown)
    return `<span class="rt"><button class="mod" data-open="${id}" aria-expanded="${S.open === id}" aria-controls="mathpop">${text}</button><button class="dbtn" data-roll="${id}" aria-label="Roll ${label}" title="Roll ${label}">${icon}</button></span>`;
  if (S.target === "hover") return `<button class="roll-h" data-roll="${id}" aria-label="Roll ${label}, ${text}" title="Roll ${label}">${svg("rolling-dices", "hi")}${text}</button>`;
  return `<button class="roll-u${minor ? " minor" : ""}" data-roll="${id}" aria-label="Roll ${label}, ${text}" title="Roll ${label}">${text}</button>`;
}
const rank = r => `<span class="rank ${r}" title="${RANKS[r][1]}" aria-label="${RANKS[r][1]}">${RANKS[r][0]}</span>`;
const total = parts => parts.reduce((s, [, v]) => s + v, 0);
const CHECK_STEPS = (f) => `<Roll name="check" label="${f}" formula="if(fortune, 2d20kh1, d20) + value" /> <FollowUp label="Reroll ({heroPoints} left)" show="heroPoints > 0"><Set field="heroPoints" formula="heroPoints - 1" /><Roll formula="if(fortune, 2d20kh1, d20) + value" /></FollowUp>`;

function renderSheet() {
  const ro = S.viewer === "reader";
  const head = `<section class="sheet-section head-section"${tag("Section")}><div class="head">
    <div class="who"><h1${tag("Text", 'field="name"')}>Tessaly Quill</h1><span class="small dim">Elf Rogue 1 · Thief racket</span></div>
    <div class="live">
      <span${tag("Tracker", 'field="heroPoints" max="3" style="pips" live')}><span class="sheet-field-label">Hero points</span>
        <span class="pips" role="group" aria-label="Hero points">${[0, 1, 2].map(i => `<button class="${i < S.hero ? "on" : ""}" aria-pressed="${i < S.hero}" aria-label="Hero point ${i + 1}" data-hero="${i}"${ro ? " disabled" : ""}></button>`).join("")}</span></span>
      <button class="toggle" aria-pressed="${S.fortune}" data-fortune${ro ? " disabled" : ""}${tag("Toggle", 'field="fortune" live')} title="Fortune: roll twice, keep the higher"><span class="mark" aria-hidden="true">${S.fortune ? "✓" : ""}</span>Fortune <span class="small" style="font-weight:600">(roll twice, keep higher)</span></button>
    </div></div></section>`;

  const acParts = [["Base", 10], ["Dex", 4], ["Trained", 3], ["Leather armor", 1]];
  const saves = `<div class="box saves"${tag("Table", 'field="saves"')}><span class="sheet-field-label">Saving Throws</span><div class="srows">
    ${SAVES.map(([n, k, r]) => { const parts = [[k, A[k]], [RANKS[r][1], P(r)]];
      return `<div class="srow"${tag("Value", `formula="${k.toLowerCase()} + prof(saves.${n.toLowerCase()})"`, "Roll steps don't exist yet", CHECK_STEPS(n))}><span>${n}</span>${target("save" + n, sg(total(parts)), n + " save", parts, () => checkSpec(n, "Save", "Saving Throws", parts))}${rank(r)}</div>`; }).join("")}
    </div></div>`;
  const defs = `<section class="sheet-section"${tag("Section")}><h2>Defenses</h2><div class="defs">
    <div class="box key"${tag("Value", 'formula="10 + min(dex, armor.dexCap) + prof(armor.rank) + armor.ac"')}><span class="sheet-field-label">Armor Class</span><span class="big">${total(acParts)}</span><span class="small dim">Leather armor</span></div>
    ${saves}</div></section>`;

  const strikes = `<section class="sheet-section strikes"${tag("Table", 'field="strikes"')}><h2>Strikes</h2><span class="aside">MAP −5 / −10 · agile −4 / −8</span>
    <div class="rows"><div class="row th"><span></span><span>Weapon</span><span>Hit · MAP</span><span>Damage</span></div>
    ${STRIKES.map((st, i) => { const parts = strikeParts(st), hit = total(parts), m = st.agile ? 4 : 5;
      const steps = `<Roll name="hit" label="Attack" formula="if(fortune, 2d20kh1, d20) + value" /> <FollowUp label="Damage"><Roll formula="strike.damage" /></FollowUp> <FollowUp label="Damage + sneak"><Roll formula="strike.damage + sneakAttack" /></FollowUp> <FollowUp label="Critical"><Roll formula="2 * (strike.damage) + strike.deadly" /></FollowUp>`;
      return `<div class="row has-traits"><span class="act" role="img" aria-label="One action">◆</span><button class="link" data-prev>${st.name}</button>
        <span class="hitcell"><span${tag("Value", 'formula="dex + prof(strike.rank) + strike.item"', "Roll and FollowUp don't exist yet", steps)}>${target("hit" + i, sg(hit), st.name + " attack", parts, () => attackSpec(i, 0))}</span>
          <span class="mapcell"${tag("Value", `formula="value - ${m}"`, "Roll steps don't exist yet", "same steps, MAP applied")}>${target("map1" + i, sg(hit - m), st.name + " second attack", [], () => attackSpec(i, 1), { noBreakdown: true, minor: true })}${target("map2" + i, sg(hit - 2 * m), st.name + " third attack", [], () => attackSpec(i, 2), { noBreakdown: true, minor: true })}</span></span>
        <span class="dmgcell"><span>1d${st.die}${st.dmg ? " + " + st.dmg : ""} P</span><span class="dim small">+1d6 sneak</span></span>
        <span class="traits">${st.traits}</span></div>`; }).join("")}</div></section>`;

  const skillMod = (n, k, r) => { const parts = [[k, A[k]], [RANKS[r][1], P(r)]]; if (CHECK[n]) parts.push(["Armor", PENALTY]); return parts; };
  const skillRow = (n, k, r, path = "Skills") => { const parts = skillMod(n, k, r);
    return `<div class="row ${r === "u" ? "untrained" : ""}"${tag("Value", `formula="${k.toLowerCase()} + prof(skills.${n.toLowerCase().replace(/\s/g, "")})"`, "Roll steps don't exist yet", CHECK_STEPS(n))}><span>${n}</span><span class="small dim">${k}</span>${rank(r)}${target("k" + n, sg(total(parts)), n, parts, () => checkSpec(n, "Check", path, parts))}</div>`; };
  const percParts = [["Wis", A.Wis], ["Expert", P("e")]];
  const initParts = [["Stealth", total(skillMod("Stealth", "Dex", "t"))]];
  const skills = `<section class="sheet-section skills"${tag("Table", 'field="skills"')}><h2>Skills</h2><span class="aside">armor −1 on Str/Dex skills</span>
    <div class="row lead"${tag("Value", 'formula="wis + prof(perception)"', "Roll steps don't exist yet", CHECK_STEPS("Perception"))}><b>Perception</b><span class="small dim">Wis</span>${rank("e")}${target("perc", sg(total(percParts)), "Perception", percParts, () => checkSpec("Perception", "Check", "Skills", percParts))}</div>
    <div class="row lead init"${tag("Value", `formula="switch(initiative.roll, 'perception', perception, get(skills, initiative.roll)) + initiative.bonus"`, "Roll steps don't exist yet", '<Roll name="initiative" label="Initiative" formula="if(fortune, 2d20kh1, d20) + value" />')}><b>Initiative</b><span class="small dim" style="grid-column:2/4">with Stealth</span>${target("init", sg(total(initParts)), "Initiative", initParts, () => checkSpec("Initiative", "Roll", "Skills", initParts))}</div>
    <div class="rows">${SKILLS.map(([n, k]) => skillRow(n, k, TRAINED[n] || "u")).join("")}</div>
    <div class="rows"${tag("Table", 'field="lore"')}>${skillRow("Underworld Lore", "Int", "t")}</div></section>`;

  const tests = `<section class="sheet-section" data-gap="mockup only: rolls with several dice"><h2>Test rolls</h2><span class="aside">mockup only</span>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${""}${TESTS.map(([a, l, t], i) => `<button class="fu" data-test="${i}">${a} · ${l} <span class="wr">${expr(t.map(x => x.t === "d" ? { ...x, faces: [] } : x.t === "x" ? { ...x, of: x.of.map(y => y.t === "d" ? { ...y, faces: [] } : y) } : x))}</span></button>`).join("")}</div>
    <div class="shapes big" aria-label="Die shapes">${[["", null, true], ["critical", "crit", true], ["fumble", "fumble", true], ["dropped", null, false]].map(([row, hi, kept]) =>
      `<div class="shaperow"><span class="sheet-field-label">${row || "plain"}</span>${[2, 4, 6, 8, 10, 12, 20].map(n => `<span class="dgroup"><span>${dieHTML({ s: n, v: hi === "fumble" ? 1 : hi === "crit" ? n : Math.ceil(n * .6), kept, hi })}</span><small>d${n}</small></span>`).join("")}</div>`).join("")}</div></section>`;
  document.getElementById("sheet").innerHTML = head + skills + `<div class="right">${defs}${strikes}${tests}</div>`;
}

// ---- Controls and clicks ----
function syncBar() {
  document.querySelectorAll("[data-ctl]").forEach(g => g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", S[g.dataset.ctl] === b.dataset.v)));
}
function renderAll() { syncBar(); renderSheet(); renderToasts(); renderRolls(); closePop(); }
function closePop() { S.open = null; document.getElementById("mathpop").hidden = true; }
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) { if (!ev.target.closest(".mathpop")) closePop(); if (ev.target.id === "drawer") { S.drawer = false; renderRolls(); } return; }
  const g = b.closest("[data-ctl]");
  if (g) { S[g.dataset.ctl] = b.dataset.v; if (g.dataset.ctl === "recent") S.drawer = false; renderAll(); return; }
  const d = b.dataset;
  if ("contrast" in d) { const box = document.getElementById("contrastbox"); box.hidden = !box.hidden; b.setAttribute("aria-expanded", !box.hidden); b.setAttribute("aria-pressed", !box.hidden); contrast(); return; }
  if (d.roll) { closePop(); show(roll(ROLLS[d.roll]())); return; }
  if (d.open) { if (S.open === d.open) return closePop(); S.open = d.open; const pop = document.getElementById("mathpop"), parts = PARTS[d.open];
    pop.innerHTML = `${parts.map(([l, v]) => `${l} <b>${sg(v)}</b>`).join(" · ")} = <b>${sg(total(parts))}</b>`; pop.hidden = false;
    const r = b.getBoundingClientRect(); pop.style.top = (r.bottom + scrollY + 4) + "px"; pop.style.left = Math.max(8, Math.min(r.left + scrollX, innerWidth - pop.offsetWidth - 8)) + "px"; return; }
  if (d.more) { const id = +d.more; S.exp.has(id) ? S.exp.delete(id) : S.exp.add(id); renderRolls(); renderToasts();
    document.querySelector(`#drawer [data-more="${id}"], #panel [data-more="${id}"]`)?.focus(); return; }
  if (d.test) { show(roll(testSpec(+d.test))); return; }
  if (d.fu) { const [id, k] = d.fu.split(":"); runFollowUp(+id, k); return; }
  if ("closetoast" in d) { if (S.recent === "stack") S.stackOpen = false; else S.toastId = null; renderToasts(); return; }
  if ("rolls" in d) { if (S.recent === "stack") { S.stackOpen = !S.stackOpen; if (!S.toastId && ENTRIES[0]) S.toastId = ENTRIES[0].id; renderToasts(); }
    else { S.drawer = true; renderRolls(); document.querySelector("#drawer [data-closedrawer]")?.focus(); } return; }
  if ("closedrawer" in d) { S.drawer = false; renderRolls(); document.querySelector("[data-rolls]").focus(); return; }
  if ("clear" in d) { ENTRIES = []; S.toastId = null; renderToasts(); renderRolls(); return; }
  if (d.hero !== undefined) { const i = +d.hero; S.hero = S.hero === i + 1 ? i : i + 1; renderSheet(); renderToasts(); renderRolls(); return; }
  if ("fortune" in d) { S.fortune = !S.fortune; renderSheet(); return; }
});
document.addEventListener("keydown", ev => { if (ev.key !== "Escape") return; if (S.drawer) { S.drawer = false; renderRolls(); } closePop(); });

function rgb(v) { const d = document.createElement("div"); d.style.color = v; document.body.append(d); const m = getComputedStyle(d).color.match(/[\d.]+/g).map(Number); d.remove(); return m; }
function lum([r, g, b]) { return [r, g, b].map(x => { x /= 255; return x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; }).reduce((s, x, i) => s + x * [.2126, .7152, .0722][i], 0); }
function ratio(a, b) { const [x, y] = [lum(rgb(a)), lum(rgb(b))].sort((p, q) => q - p); return (x + .05) / (y + .05); }
function contrast() {
  const pairs = [["ink on panel", "--st-ink", "--st-panel", 4.5], ["muted on panel", "--st-ink-muted", "--st-panel", 4.5], ["muted on panel-muted", "--st-ink-muted", "--st-panel-muted", 4.5],
    ["primary on panel (roll targets, follow-ups)", "--st-primary", "--st-panel", 4.5], ["on-primary on primary (natural 20)", "--st-on-primary", "--st-primary", 4.5],
    ["border-strong on panel (dropped die outline)", "--st-border-strong", "--st-panel", 3], ["primary on panel (die outline)", "--st-primary", "--st-panel", 3], ["error on panel (fumble face and outline)", "--ui-error", "--st-panel", 4.5]];
  document.getElementById("contrast").innerHTML = pairs.map(([n, f, b, min]) => { const r = ratio(`var(${f})`, `var(${b})`);
    return `<tr><td>${n}</td><td>${r.toFixed(2)}:1</td><td>${r >= min ? "pass" : "FAIL"} (≥ ${min})</td></tr>`; }).join("");
}

document.getElementById("rollsicon").innerHTML = svg("rolling-dices", "w-4 h-4");
// A few rolls already made, so the lists aren't empty.
(() => { const a = roll(attackSpec(0, 0)); a.used = new Set(["sneak"]); roll(damageSpec(0, "sneak"), a); S.fortune = true; roll(checkSpec("Stealth", "Check", "Skills", [["Dex", 4], ["Trained", 3], ["Armor", -1]])); S.fortune = false; })();
renderAll();
</script>
</body>
