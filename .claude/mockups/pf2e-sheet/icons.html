<title>PF2e Sheet Icons</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
/* Icon choices for the PF2e sheet's section labels and tabs (game-icons.net, CC BY 3.0). */
:root { --st-page: var(--color-folio-100); --st-panel: var(--ui-bg); --st-panel-muted: var(--ui-bg-elevated); --st-ink: var(--ui-text-highlighted); --st-ink-muted: var(--ui-text-muted); --st-primary: var(--ui-primary); --st-on-primary: var(--ui-text-inverted); --st-border: var(--ui-border); --st-border-strong: var(--ui-border-accented); --st-radius: calc(var(--ui-radius) * 1.5); --st-font-body: var(--font-sans); --st-font-display: var(--font-display); }
body { margin: 0; background: var(--st-page); color: var(--st-ink); font-family: var(--st-font-body); }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; background: var(--st-panel); border-bottom: 1px solid var(--st-border); position: sticky; top: 0; z-index: 5; }
.bar b { font-family: var(--st-font-display); font-size: 20px; } .bar small { color: var(--st-ink-muted); }
main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
.sec { background: var(--st-panel); border: 1px solid var(--st-border); border-radius: var(--st-radius); padding: 10px 12px; }
.sec h3 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--st-ink-muted); }
.opts { display: flex; flex-wrap: wrap; gap: 10px; }
.opt { display: grid; justify-items: center; gap: 6px; padding: 10px 10px 6px; border: 1px solid var(--st-border); border-radius: var(--st-radius); background: var(--st-panel); cursor: pointer; font: inherit; color: inherit; min-width: 150px; }
.opt[aria-pressed="true"] { border-color: var(--st-primary); box-shadow: inset 0 0 0 1px var(--st-primary); background: var(--st-panel-muted); }
.opt:focus-visible { outline: 2px solid var(--st-primary); outline-offset: 2px; }
.opt small { font-size: 11px; color: var(--st-ink-muted); }
.opt small b { color: var(--st-ink); }
/* The label as the sheet draws it: a folio tab, icon inline. */
.tab { display: inline-flex; align-items: center; gap: .3em; font-family: var(--st-font-display); font-size: 15px; line-height: 1; padding: 3px 10px 4px; border: 1px solid var(--st-border-strong); border-bottom-color: transparent; border-radius: 5px 5px 0 0; background: var(--st-panel); white-space: nowrap; }
.tab.big { font-size: 19px; }
.gi { display: block; width: .95em; height: .95em; fill: var(--st-primary); flex: none; }
.big-icon { width: 40px; height: 40px; fill: var(--st-primary); }
#picks { font-size: 12px; color: var(--st-ink-muted); }
</style>
</head>
