<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PF2e Demo Sheet</title>
<script src="../_kit/app-theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
/* Sheet tokens, as app/assets/css/main.css maps them. */
:root {
  --st-page: var(--color-folio-100); --st-panel: var(--ui-bg); --st-panel-muted: var(--ui-bg-elevated);
  --st-ink: var(--ui-text-highlighted); --st-ink-muted: var(--ui-text-muted);
  --st-primary: var(--ui-primary); --st-on-primary: var(--ui-text-inverted); --st-accent: var(--ui-secondary);
  --st-border: var(--ui-border); --st-border-strong: var(--ui-border-accented);
  --st-radius: calc(var(--ui-radius) * 1.5);
  --st-font-body: var(--font-sans); --st-font-display: var(--font-display);
}
body { margin: 0; background: var(--st-page); color: var(--st-ink); font-family: var(--st-font-body); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--st-primary); outline-offset: 2px; }

/* Mockup chrome (not part of the sheet). */
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; background: var(--st-panel); border-bottom: 1px solid var(--st-border); position: sticky; top: 0; z-index: 5; }
.bar b { font-family: var(--st-font-display); font-size: 20px; }
.bar small { color: var(--st-ink-muted); }
.ctl { display: inline-flex; border: 1px solid var(--st-border-strong); border-radius: 6px; overflow: hidden; }
.ctl button { font-size: 13px; padding: 4px 10px; border: 0; background: transparent; cursor: pointer; }
.ctl button[aria-pressed="true"] { background: var(--st-primary); color: var(--st-on-primary); font-weight: 700; }
[data-gap] { outline: 2px dashed var(--ui-warning); outline-offset: 1px; }
body.nogaps [data-gap] { outline: 0; }

/* Density: the proposed built-in setting (one attribute on <Sheet>). */
.sheet[data-density="compact"] { --d-gap: 6px; --d-pad: 8px; --d-h: 24px; --d-fs: 13px; --d-lfs: 10.5px; --d-big: 22px; --d-hero: 30px; --d-h2: 15px; }
.sheet[data-density="roomy"]   { --d-gap: 16px; --d-pad: 16px; --d-h: 36px; --d-fs: 15px; --d-lfs: 12.5px; --d-big: 28px; --d-hero: 38px; --d-h2: 19px; }

.sheet { max-width: 1180px; margin: 0 auto; padding: calc(var(--d-gap) + 10px) var(--d-gap) var(--d-gap); display: grid; gap: calc(var(--d-gap) + 10px) var(--d-gap); font-size: var(--d-fs); }
/* Motif: section labels sit on the panel's top edge like folio tabs. */
.sheet-section { position: relative; background: var(--st-panel); border: 1px solid var(--st-border); border-radius: var(--st-radius); padding: calc(var(--d-pad) + 6px) var(--d-pad) var(--d-pad); min-width: 0; }
.sheet-section > h2 { position: absolute; white-space: nowrap; top: 0; left: var(--d-pad); transform: translateY(-55%); margin: 0; font-family: var(--st-font-display); font-size: var(--d-h2); line-height: 1; padding: 3px 10px 4px; background: var(--st-panel); border: 1px solid var(--st-border-strong); border-bottom-color: var(--st-panel); border-radius: calc(var(--st-radius) * .8) calc(var(--st-radius) * .8) 0 0; }
.sheet-section > .aside { position: absolute; top: 0; right: var(--d-pad); transform: translateY(-50%); font-size: var(--d-lfs); color: var(--st-ink-muted); font-weight: 700; background: var(--st-panel); padding: 0 6px; }
.sheet-field-label { font-size: var(--d-lfs); color: var(--st-ink-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.sheet-field-value { font-weight: 700; font-variant-numeric: tabular-nums; }
input, select { font: inherit; color: var(--st-ink); height: var(--d-h); box-sizing: border-box; border: 1px solid var(--st-border-strong); border-radius: calc(var(--st-radius) * .66); background: var(--st-panel); padding: 0 6px; min-width: 0; }
.dim { color: var(--st-ink-muted); font-weight: 400; }
.small { font-size: var(--d-lfs); }
.chip { display: inline-block; font-size: var(--d-lfs); border: 1px solid var(--st-border); border-radius: 4px; padding: 0 4px; margin: 1px 2px 1px 0; color: var(--st-ink-muted); white-space: nowrap; }
/* Icons sit inline with their label, centered on it. */
.gi { display: block; width: 1em; height: 1em; fill: currentColor; flex: none; }
.sheet-section > h2, .tabs button { display: inline-flex; align-items: center; gap: .3em; }
.sheet-section > h2 .gi.sec, .tabs .gi.sec { color: var(--st-primary); width: .95em; height: .95em; }
.sheet-section > h2 > span, .tabs button > span { display: contents; }
.act { font-family: var(--st-font-body); color: var(--st-primary); font-weight: 700; letter-spacing: 0; white-space: nowrap; font-size: 1.45em; line-height: 1; }
.act.small { font-size: 1.2em; }
.link { color: var(--st-primary); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.link.plain { color: var(--st-ink); }
.pick { border: 1px dashed var(--st-border-strong); border-radius: 4px; padding: 0 6px; color: var(--st-primary); background: var(--st-panel-muted); cursor: pointer; font-size: var(--d-lfs); font-weight: 700; }
.mod { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; background: none; border: 0; padding: 0 2px; cursor: pointer; border-bottom: 1px dotted var(--st-border-strong); }
.parts { grid-column: 1 / -1; font-size: var(--d-lfs); color: var(--st-ink-muted); background: var(--st-panel-muted); border-radius: 4px; padding: 2px 6px; }
.parts b { color: var(--st-ink); }
.rank { display: inline-grid; place-items: center; width: 20px; height: 17px; border-radius: 4px; font-size: 10.5px; font-weight: 700; border: 1px solid var(--st-border-strong); color: var(--st-ink-muted); }
.rank.t, .rank.e, .rank.m, .rank.l { background: var(--st-primary); color: var(--st-on-primary); border-color: var(--st-primary); }
select.rank-sel { width: 46px; height: calc(var(--d-h) - 4px); padding: 0 2px; font-size: var(--d-lfs); }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips button { width: 13px; height: 13px; border: 1.5px solid var(--st-primary); border-radius: 50%; background: transparent; padding: 0; cursor: pointer; }
.pips button.on { background: var(--st-primary); }
.pips.sq button { border-radius: 2px; }
.pips.bad button { border-color: var(--ui-error); } .pips.bad button.on { background: var(--ui-error); }

/* Header */
.head { display: grid; grid-template-columns: 1fr auto; gap: var(--d-gap) 20px; align-items: start; }
.head h1 { font-family: var(--st-font-display); font-size: calc(var(--d-big) * 1.35); margin: 0; line-height: 1; }
/* Core build choices: label above a larger value, like the identity fields of a paper sheet. */
.refs { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 8px; }
.refgroup { display: inline-flex; gap: 6px 8px; flex-wrap: nowrap; }
.ref { display: inline-grid; gap: 0; align-content: center; border: 1px solid var(--st-border-strong); border-radius: calc(var(--st-radius) * .8); padding: 3px 12px 4px; background: var(--st-panel-muted); }
.ref .sheet-field-label { line-height: 1.2; }
.ref .link { font-size: calc(var(--d-fs) + 3px); line-height: 1.25; }
.meta { display: flex; border: 1px solid var(--st-border); border-radius: var(--st-radius); background: var(--st-panel-muted); }
.meta > div { display: grid; grid-template-rows: auto calc(var(--d-big) * 1.3); align-items: center; justify-items: center; gap: 2px; padding: calc(var(--d-pad) * .6) calc(var(--d-pad) + 6px); }
.meta > div + div { border-left: 1px solid var(--st-border); }
.meta .sheet-field-value { font-size: var(--d-big); line-height: 1; }
.meta .sheet-field-value.word { font-size: calc(var(--d-big) * .7); }
.meta .pips button { width: 17px; height: 17px; }
/* Desktop: the strip sits centered beside the name and chips, a bit larger. */
@media (min-width: 901px) {
  .head > .meta { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .head > .facts { grid-column: 1; }
  .meta > div { padding: calc(var(--d-pad) * .9) calc(var(--d-pad) + 14px); grid-template-rows: auto calc(var(--d-big) * 1.5); }
  .meta .sheet-field-value { font-size: calc(var(--d-big) * 1.15); }
  .meta .pips button { width: 19px; height: 19px; }
}
.facts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 14px; }

/* Defenses: hero numbers first, then the rest. */
.top { display: grid; grid-template-columns: auto 1fr; gap: var(--d-gap); align-items: stretch; }
.attrs { display: grid; grid-template-columns: repeat(3, 76px); grid-auto-rows: 1fr; gap: 6px; }
.attrs .box { padding: calc(var(--d-pad) * .6) 4px; }
.attrs .box .sheet-field-value { font-size: calc(var(--d-big) * 1.2); }
.attrs .box.key { border: 1px solid var(--st-primary); box-shadow: inset 0 0 0 1px var(--st-primary); }
.keytag { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; line-height: 1; padding: 2px 5px; border-radius: 3px; background: var(--st-primary); color: var(--st-on-primary); }
.box { border: 1px solid var(--st-border-strong); border-radius: var(--st-radius); padding: calc(var(--d-pad) * .45); text-align: center; background: var(--st-panel); display: grid; gap: 1px; align-content: center; position: relative; }
.box .sheet-field-value { font-size: var(--d-big); line-height: 1.05; }
.box .mod { font-size: var(--d-big); border-bottom: 0; text-align: center; }
.box.key { border: 2px solid var(--st-primary); }
.box input { width: 100%; text-align: center; font-weight: 700; }
.defs { display: grid; grid-template-columns: .9fr 2fr 1.2fr; gap: var(--d-gap); }
.saves { text-align: left; align-content: start; gap: 2px; }
.saves .srow { display: grid; grid-template-columns: 1fr auto 24px; align-items: center; gap: 6px; }
.saves .srow .mod { font-size: calc(var(--d-big) * .8); border-bottom: 1px dotted var(--st-border-strong); }
.saves .parts { margin-top: 2px; }
.hero-n .sheet-field-value, .hero-n .mod { font-size: var(--d-hero); }
.hp { text-align: left; grid-template-columns: 1fr auto; gap: 3px 8px; }
.hp .now { display: flex; align-items: baseline; gap: 4px; }
.hp .now input { width: 58px; height: calc(var(--d-hero) + 4px); font-size: var(--d-hero); font-weight: 700; }
.hp .max { font-size: calc(var(--d-hero) * .7); font-weight: 700; color: var(--st-ink-muted); }
.hp .hpline { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.hp .temp { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.hp .adj { display: flex; gap: 4px; align-items: center; }
.hp .adj input { width: 48px; text-align: center; }
.hp .adj button { height: var(--d-h); padding: 0 10px; border: 1px solid var(--st-border-strong); border-radius: calc(var(--st-radius) * .66); background: var(--st-panel); cursor: pointer; font-size: var(--d-lfs); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.hp .temp input { width: 48px; height: calc(var(--d-big) + 6px); font-size: var(--d-big); font-weight: 700; text-align: center; }
.meter { grid-column: 1 / -1; height: 6px; background: var(--st-panel-muted); border: 1px solid var(--st-border); border-radius: 3px; overflow: hidden; } .meter i { display: block; height: 100%; background: var(--st-primary); }
.death { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.box .parts { text-align: left; }
.strip { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin-top: var(--d-gap); }

/* Rows */
.rows { display: grid; }
.row { display: grid; align-items: center; gap: 6px; min-height: var(--d-h); border-bottom: 1px solid var(--st-border); padding: calc(var(--d-gap) * .3) 0; }
.row:last-child { border-bottom: 0; }
.row.th { min-height: 0; } .row.th > * { font-size: var(--d-lfs); color: var(--st-ink-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.row.untrained > span:first-child, .row.untrained .mod { color: var(--st-ink-muted); font-weight: 400; }
/* One row grid for both columns, so rows line up across them. */
.skills .cols2 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(var(--half), auto); grid-auto-flow: column; column-gap: calc(var(--d-gap) * 3); }
.skills .row { grid-template-columns: 1fr 30px 46px 42px; }
.skills .init { grid-template-columns: auto 1fr 42px; border-bottom: 2px solid var(--st-border-strong); margin-bottom: calc(var(--d-gap) * .5); }
.skills .lead > b { font-family: var(--st-font-display); font-size: var(--d-h2); }
.skills .lead .mod { font-size: calc(var(--d-big) * .8); }
.skills .init select { justify-self: end; width: auto; }

.strikes .row { grid-template-columns: 30px 1.1fr 118px 1fr 1.6fr; }
.strikes .dt { display: contents; }
.mapcell { font-size: var(--d-lfs); color: var(--st-ink-muted); white-space: nowrap; }
.acts .row { grid-template-columns: 76px 1fr auto; }
.pair { display: grid; grid-template-columns: 1.5fr 1fr; gap: calc(var(--d-gap) + 10px) var(--d-gap); align-items: stretch; }
.pair .row { min-height: calc(var(--d-h) + 12px); }
.pair .row:not(.th) .link { font-size: calc(var(--d-fs) + 1px); }
.mapcell { margin-left: 6px; word-spacing: 4px; }
.inv .row { grid-template-columns: 1fr 40px 40px 66px 30px; }
.mid { display: grid; grid-template-columns: 1.35fr 1fr; gap: calc(var(--d-gap) + 10px) var(--d-gap); align-items: start; }
.mid > div { display: grid; gap: calc(var(--d-gap) + 10px); }
/* Tabs right: skills keep one column of rows; the tabs take the wider side. */
.mid.right { grid-template-columns: minmax(300px, 1fr) 1.5fr; }
.mid.right .skills .cols2 { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; }
.mid.right .tabpanel { min-height: 640px; }
.feats { display: grid; gap: var(--d-gap); grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.feat { border-left: 3px solid var(--st-accent); padding-left: 6px; }
.feat .small { color: var(--st-ink-muted); display: block; }
.feat.empty { border-left-style: dashed; border-left-color: var(--st-border-strong); }
.profrows { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; align-items: center; }
.profrows > div { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; align-items: baseline; }

/* Tabs for the long lists. */
.tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: -1px; position: relative; }
.tabs button { white-space: nowrap; padding: 4px 12px; border: 1px solid transparent; border-bottom: 0; background: transparent; color: var(--st-ink-muted); cursor: pointer; font-family: var(--st-font-display); font-size: var(--d-h2); font-weight: 700; border-radius: calc(var(--st-radius) * .8) calc(var(--st-radius) * .8) 0 0; }
.tabs button[aria-selected="true"] { background: var(--st-panel); border-color: var(--st-border-strong); color: var(--st-ink); }
.tabpanel { background: var(--st-panel); border: 1px solid var(--st-border-strong); border-radius: 0 var(--st-radius) var(--st-radius) var(--st-radius); padding: calc(var(--d-pad) * 1.5); min-height: 420px; }
/* Full-width tabs: wide panels split into columns. */
.tabcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: calc(var(--d-gap) * 2) calc(var(--d-gap) * 4); align-items: start; }
@media (max-width: 900px) { .tabpanel, .mid.right .tabpanel { min-height: 0; } .mid.right { grid-template-columns: 1fr; } }

/* Reference preview */
.preview { position: fixed; right: 16px; bottom: 16px; width: min(340px, calc(100vw - 32px)); background: var(--st-panel); border: 1px solid var(--st-border-strong); border-radius: var(--st-radius); box-shadow: 0 8px 24px rgb(0 0 0 / .15); padding: 12px; z-index: 6; }
.preview h3 { font-family: var(--st-font-display); font-size: 20px; margin: 0 0 4px; }

@media (max-width: 900px) {
  .top { grid-template-columns: 1fr; } .attrs { grid-template-columns: repeat(6, 1fr); }
  .defs { grid-template-columns: 1fr 1.3fr; grid-template-areas: "hp hp" "ac saves"; }
  .defs .ac { grid-area: ac; } .defs .hp { grid-area: hp; } .defs .saves { grid-area: saves; }
  .mid, .pair { grid-template-columns: 1fr; } .skills .cols2 { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; }
  .head { grid-template-columns: 1fr; } .meta { justify-content: start; }
  .strikes .row.th { display: none; }
  .strikes .row { grid-template-columns: 22px 1fr auto; row-gap: 0; }
  .strikes .dt { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; grid-column: 2 / -1; font-size: var(--d-lfs); }
}
.contrast { position: fixed; top: 52px; right: 16px; z-index: 6; font-size: 12px; color: var(--st-ink-muted); background: var(--st-panel); border: 1px solid var(--st-border-strong); border-radius: 6px; padding: 8px 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .15); }
.contrast[hidden] { display: none; }
.contrast td { padding: 1px 8px 1px 0; }
</style>
</head>
<body>
<div class="bar">
  <b>PF2e demo sheet</b><small>mockup v4 · draft</small>
  <div class="ctl" role="group" aria-label="Mode" data-ctl="mode"><button data-v="play">Play</button><button data-v="edit">Edit</button></div>
  <div class="ctl" role="group" aria-label="Density" data-ctl="density"><button data-v="compact">Compact</button><button data-v="roomy">Roomy</button></div>
  <div class="ctl" role="group" aria-label="Layout" data-ctl="layout"><button data-v="below">Tabs below</button><button data-v="right">Tabs right</button></div>
  <div class="ctl" role="group" aria-label="Section icons" data-ctl="secicons"><button data-v="on">Icons</button><button data-v="off">No icons</button></div>
  <div class="ctl" role="group" aria-label="Character" data-ctl="pc"><button data-v="cleric">Cleric</button><button data-v="rogue">Rogue</button></div>
  <div class="ctl" role="group" aria-label="Gap outlines" data-ctl="gaps"><button data-v="on">Gaps</button><button data-v="off">Hide gaps</button></div>
  <div class="ctl"><button data-contrast aria-expanded="false" aria-controls="contrastbox">Contrast</button></div>
</div>
<main id="sheet" class="sheet" data-tag="Sheet" data-attrs='density="compact"' data-gap="density attribute doesn't exist yet"></main>
<div id="preview"></div>
<div class="contrast" id="contrastbox" hidden><table id="contrast"></table></div>

  if (g.includes("–")) { const [lo, hi] = g.split("–").map(kind); return `<span class="act${small ? " small" : ""}" role="img" aria-label="${lo} to ${hi} actions">${g}</span>`; }

const rank = (r, id) => E() ? `<select class="rank-sel" aria-label="Proficiency">${Object.entries(RANKS).map(([k, v]) => `<option ${k === r ? "selected" : ""}>${v[0]}</option>`).join("")}</select>`
  : `<span class="rank ${r}" title="${RANKS[r][1]}" aria-label="${RANKS[r][1]}">${RANKS[r][0]}</span>`;
// A modifier that opens its breakdown; parts are [label, value].
function mod(id, parts, base = 0) {
  const total = base + parts.reduce((s, [, v]) => s + v, 0);
  return { total, btn: `<button class="mod" aria-expanded="${S.open === id}" data-open="${id}">${base ? total : sg(total)}</button>`,
    parts: S.open === id ? `<div class="parts">${base ? `<b>${base}</b> base · ` : ""}${parts.map(([l, v]) => `${l} <b>${sg(v)}</b>`).join(" · ")} = <b>${base ? total : sg(total)}</b></div>` : "" };
}
const pips = (n, max, cls = "", label) => `<span class="pips ${cls}" role="group" aria-label="${label}">${Array.from({ length: max }, (_, i) => `<button class="${i < n ? "on" : ""}" aria-pressed="${i < n}" aria-label="${label} ${i + 1}"></button>`).join("")}</span>`;
const ref = (v, field) => E() ? `<span class="link">${v}</span> <button class="pick"${tag("Ref", `field="${field}"`)}>Change</button>` : `<button class="link" data-prev="${v}">${v}</button>`;
const live = (html, a) => `<span${tag(a.split(" ")[0], a.slice(a.indexOf(" ") + 1) + " live", "live attribute doesn't exist yet")}>${html}</span>`;

function render() {
  const c = PCS[S.pc], L = c.level, a = c.attr;
  const penalty = c.armor.check;

  const head = `<section class="sheet-section"${tag("Section")}>${h2("Character")}<div class="head">
    <div><h1${tag("Text", 'field="name"')}>${E() ? `<input value="${c.name}" aria-label="Name" style="font:inherit;height:auto;width:min(100%,420px)">` : c.name}</h1>
      <div class="refs">${(() => { const chip = ([l, v, f]) => `<span class="ref"><span class="sheet-field-label">${l}</span>${ref(v, f)}</span>`;
        // Class and its subclass wrap together, never apart.
        return [["Ancestry",c.ancestry,"ancestry"],["Heritage",c.heritage,"heritage"],["Background",c.background,"background"]].map(chip).join("")
          + `<span class="refgroup">${chip(["Class",c.cls,"class"])}${chip([c.subLabel,c.sub,"subclass"])}</span>`; })()}</div></div>
    <div class="meta">
      <div><div class="sheet-field-label">Level</div><span class="sheet-field-value"${tag("Number", 'field="level"')}>${E() ? `<input type="number" value="${L}" style="width:48px" aria-label="Level">` : L}</span></div>
      <div><div class="sheet-field-label">Hero points</div>${live(pips(c.hero, 3, "", "Hero point"), 'Tracker field="heroPoints" max="3" style="pips"')}</div>
      <div><div class="sheet-field-label">Speed</div><span><span class="sheet-field-value"${tag("Value", 'formula="{ancestry.speed}"')}>${c.speed}</span> <span class="dim small">ft</span></span></div>
      <div><div class="sheet-field-label">Size</div><span class="sheet-field-value word">${c.size}</span></div>
    </div>
    <div class="facts small"><span><span class="sheet-field-label">Traits</span> ${c.traits.map(t => `<span class="chip">${t}</span>`).join("")}</span>
      ${c.senses ? `<span><span class="sheet-field-label">Senses</span> ${c.senses}</span>` : E() ? `<span${tag("Section", 'show="{editing or senses}"', "editing isn't visible to formulas yet")}><span class="sheet-field-label">Senses</span> <button class="pick">+ Add</button></span>` : ""}<span><span class="sheet-field-label">Languages</span> ${c.languages}</span></div>
  </div></section>`;

  const attrs = `<div class="attrs"${tag("Grid", 'columns="3"')}>${ATTR.map(k => `<div class="box ${k === c.key ? "key" : ""}"${tag("Number", `field="attributes.${k.toLowerCase()}" signed`)}>
      ${k === c.key ? `<span class="keytag">Key</span>` : ""}<span class="sheet-field-label">${k}</span>${E() ? `<input type="number" value="${a[k]}" aria-label="${k}">` : `<span class="sheet-field-value">${sg(a[k])}</span>`}</div>`).join("")}</div>`;

  const shieldUp = S.shieldUp && c.shield;
  const ac = mod("ac", [["Dex" + (c.armor.cap < 99 ? ` (cap ${sg(c.armor.cap)})` : ""), Math.min(a.Dex, c.armor.cap)], [RANKS[c.armor.rank][1], P(c.armor.rank, L)], ["Armor", c.armor.ac], ...(shieldUp ? [["Shield raised", c.shield.ac]] : [])], 10);
  const perc = mod("perc", [["Wis", a.Wis], [RANKS[c.perc][1], P(c.perc, L)]]);
  const saveRows = Object.entries(c.saves).map(([n, [k, r]]) => ({ n, k, m: mod(n, [[k, a[k]], [RANKS[r][1], P(r, L)]]), r }));
  const saves = `<div class="box saves"${tag("Table", 'field="saves" rows="fixed"', "breakdown on a box")}><span class="sheet-field-label">Saving Throws</span>
    <div class="srows">${saveRows.map(({ n, k, m, r }) => `<div class="srow"${tag("Value", `formula="{${k.toLowerCase()} + prof(saves.${n.toLowerCase()})}"`)}><span>${n}</span>${m.btn}${rank(r)}</div>`).join("")}</div>
    ${saveRows.map(x => x.m.parts).join("")}</div>`;
  const defs = `<div style="min-width:0"><div class="defs">
    <div class="box key hero-n ac"${tag("Value", 'formula="{10 + min(dex, armor.dexCap) + prof(armor.rank) + armor.ac + (shieldRaised ? shield.ac : 0)}"', "breakdown on a box")}><span class="sheet-field-label">Armor Class</span>${ac.btn}<span class="small dim">${c.armor.name}</span>${ac.parts}</div>
    <div class="box hp"${tag("Tracker", 'field="hp" max="{ancestry.hp + (class.hp + con) * level}" live', "live attribute doesn't exist yet")}>
      <span class="sheet-field-label" style="grid-column:1/-1">Hit Points</span>
      <div class="hpline"><span class="now"><input aria-label="Current HP" value="${c.hp}"><span class="max">/ ${c.hpMax}</span></span>
      <span class="adj"${tag("Button", 'action="damage" live', "no tag yet for a button that changes a field")}><input aria-label="Amount" placeholder="0" inputmode="numeric" data-amt><button data-hpdo="damage">Damage</button><button data-hpdo="heal">Heal</button></span><span class="temp"><span class="sheet-field-label">Temp</span><input aria-label="Temp HP" value="${c.temp}"></span></div>
      <div class="meter"><i style="width:${c.hp / c.hpMax * 100}%"></i></div>
      <div class="death small"><span><span class="sheet-field-label">Dying</span> ${pips(c.dying, 4, "bad", "Dying")}</span><span><span class="sheet-field-label">Wounded</span> ${pips(c.wounded, 3, "bad sq", "Wounded")}</span><span><span class="sheet-field-label">Doomed</span> ${pips(c.doomed, 3, "bad sq", "Doomed")}</span></div>
    </div>
    ${saves}
  </div>
  <div class="strip small">
    ${c.shield ? `<span${tag("Toggle", 'field="shieldRaised" live', "live attribute doesn't exist yet")}><label><input type="checkbox" ${shieldUp ? "checked" : ""} data-shield style="height:auto"> <b>${c.shield.name}</b> raised</label> <span class="dim">Hardness ${c.shield.hard} · HP ${c.shield.hp} · BT ${c.shield.bt}</span></span>` : ""}
    <span><span class="sheet-field-label">Resist / weak</span> <span class="dim">none</span></span>
    <span${tag("Tags", 'field="conditions" live', "conditions don't change the numbers")}><span class="sheet-field-label">Conditions</span> ${S.pc === "rogue" ? `<span class="chip">Frightened 1</span>` : `<span class="dim">none</span>`} <button class="pick">+ Add</button></span>
  </div></div>`;

  const top = `<section class="sheet-section"${tag("Section")}>${h2("Attributes &amp; Defenses")}<div class="top">${attrs}${defs}</div></section>`;

  const strikes = `<section class="sheet-section strikes"${tag("Table", 'field="strikes"', "hit and damage typed, not read from the inventory item")}>${h2("Strikes")}<span class="aside">MAP −5 / −10</span>
    <div class="rows"><div class="row th"><span></span><span>Weapon</span><span>Hit · MAP</span><span>Damage</span><span>Traits</span></div>
    ${c.strikes.map(([g, n, k, r, item, d, t]) => { const m = mod("s" + n, [[k, a[k]], [RANKS[r][1], P(r, L)], ["Item", item]]);
      return `<div class="row">${glyph(g)}<button class="link plain" data-prev="${n}">${n}</button><span><span data-gap="roll button">${m.btn}</span> <span class="mapcell">${sg(m.total - 5)} ${sg(m.total - 10)}</span></span><span class="dt"><span>${d}${c.sneak ? ` <span class="dim small">+${c.sneak} sneak</span>` : ""}</span><span>${t.split(" · ").map(x => `<span class="chip">${x}</span>`).join("")}</span></span>${m.parts}</div>`; }).join("")}
    ${E() ? `<div class="row"><button class="pick" style="justify-self:start;grid-column:1/-1" data-add="strikes">+ Add strike</button></div>` : ""}</div></section>`;

  const actions = `<section class="sheet-section acts"${tag("List", 'field="actions" item="Ref"')}>${h2("Actions &amp; Reactions")}
    <div class="rows">${c.actions.map(([g, n, d]) => `<div class="row">${glyph(g)}<button class="link plain" data-prev="${n}">${n}</button><span class="small dim">${d}</span></div>`).join("")}
    ${E() ? `<div class="row"><button class="pick" style="justify-self:start;grid-column:1/-1" data-add="actions">+ Add action</button></div>` : ""}</div></section>`;

  const skillRow = ([n, k, r]) => { const parts = [[k, a[k]], [RANKS[r][1], P(r, L)]]; if (CHECK[n] && penalty) parts.push(["Armor", penalty]);
    const m = mod("k" + n, parts);
    return `<div class="row ${r === "u" ? "untrained" : ""}"><span>${n}</span><span class="small dim">${k}</span>${rank(r)}${m.btn}${m.parts}</div>`; };
  const skillMod = n => { if (n === "Perception") return a.Wis + P(c.perc, L); const [, k] = SKILLS.find(x => x[0] === n); const r = c.skills[n] || "u"; return a[k] + P(r, L) + (CHECK[n] && penalty ? penalty : 0); };
  const im = mod("init", [[c.init, skillMod(c.init)], ...(c.initBonus || [])]);
  const init = `<div class="row lead init"${tag("Value", `formula="{switch(initiative.roll, 'perception', perception, get(skills, initiative.roll)) + initiative.bonus}"`)}><b>Initiative</b>
    <span${tag("Select", 'field="initiative.roll" live', "live attribute doesn't exist yet")} style="justify-self:end"><select aria-label="Initiative rolls with">${["Perception", ...SKILLS.map(x => x[0])].map(n => `<option ${n === c.init ? "selected" : ""}>${n}</option>`).join("")}</select></span>${im.btn}${im.parts}</div>`;
  const all = [...SKILLS.map(([n, k]) => [n, k, c.skills[n] || "u"]), ...c.lore];
  const half = Math.ceil(all.length / 2);
  const skills = `<section class="sheet-section skills"${tag("Table", 'field="skills" rows="fixed"')}>${h2("Skills")}<span class="aside">${penalty ? `armor ${penalty} on Str/Dex skills` : ""}</span>
    <div class="row lead"${tag("Value", 'formula="{wis + prof(perception)}"')}><b>Perception</b><span class="small dim">Wis</span>${rank(c.perc)}${perc.btn}${perc.parts}</div>
    ${init}<div class="cols2" style="--half:${half}">${all.map(skillRow).join("")}</div></section>`;

  const profs = `<section class="sheet-section"${tag("Grid", 'columns="2"')}>${h2("Proficiencies")}
    <div class="profrows">${Object.entries(c.profs).map(([g, list]) => `<span class="sheet-field-label">${g}</span><div>${list.map(([n, r]) => `<span style="white-space:nowrap">${rank(r)} <span class="small">${n}</span></span>`).join("")}</div>`).join("")}
      <span class="sheet-field-label">Class DC</span><div><span><b>${10 + a[c.key] + P(c.classDC, L)}</b> ${rank(c.classDC)}</span></div></div></section>`;

  // Long lists in tabs.
  const feats = `<div class="feats"${tag("List", 'field="feats" item="Ref"')}>${c.feats.map(([ty, n, src, g]) => `<div class="feat"><button class="link plain" data-prev="${n}">${n}</button> ${g ? glyph(g) : ""}<span class="small">${ty} · ${src === "Background" ? "from background" : "level " + src}</span></div>`).join("")}
    ${E() ? c.upcoming.map(([lv, ty]) => `<div class="feat empty"${tag("Section", 'show="{editing}"', "editing isn't visible to formulas yet")}><button class="pick">Choose ${ty.toLowerCase()}</button><span class="small">level ${lv}</span></div>`).join("") : ""}</div>`;
  const dz = c.deity;
  const klass = `<div class="tabcols"><div class="rows"${tag("List", 'field="class.features" item="Ref"', "a list read from the referenced class")}><div class="row th" style="grid-template-columns:52px 1fr"><span>Level</span><span>Class feature</span></div>
      ${c.features.map(([lv, n]) => `<div class="row ${+lv > L ? "untrained" : ""}" style="grid-template-columns:52px 1fr"><span class="small">${lv}</span><button class="link plain" data-prev="${n}">${n}</button></div>`).join("")}</div>
    ${dz ? `<div${tag("Section", 'field="deity"')}><div class="kv small"><span class="sheet-field-label">Deity</span><span>${ref(dz.name, "deity")}</span>
        ${[["Divine font", dz.font], ["Sanctification", dz.sanct], ["Divine skill", dz.skill], ["Favored weapon", dz.weapon], ["Domains", dz.domains], ["Divine attributes", dz.attrs]].map(([k, v]) => `<span class="sheet-field-label">${k}</span><span>${v}</span>`).join("")}
        <span class="sheet-field-label">Edicts</span><span class="dim">From the imported deity's text.</span><span class="sheet-field-label">Anathema</span><span class="dim">From the imported deity's text.</span></div></div>` : ""}</div>`;
  const sp = c.spells;
  const spells = sp ? (() => { const dc = 10 + a[sp.attr] + P("t", L), atk = a[sp.attr] + P("t", L);
    return `<div class="strip small" style="margin:0 0 var(--d-gap)"><b>${sp.trad} prepared</b><span><span class="sheet-field-label">Spell DC</span> <b>${dc}</b></span><span><span class="sheet-field-label">Attack</span> <b>${sg(atk)}</b></span></div>
    <div class="rows"><div class="row th" style="grid-template-columns:70px 1fr"><span>Rank</span><span>Spells</span></div>
      <div class="row" style="grid-template-columns:70px 1fr"><span class="sheet-field-label">Cantrips</span><span>${sp.cantrips.map(([n, g]) => `<button class="link plain" data-prev="${n}">${n}</button> ${glyph(g, true)}`).join(" &nbsp; ")}</span></div>
      <div class="row" style="grid-template-columns:70px 1fr"><span class="sheet-field-label">1</span><span>${sp.r1.map(([n, g, used]) => `<span style="white-space:nowrap">${live(pips(used, 1, "sq", n + " cast"), 'Checkbox field="slots.r1.cast"')} <button class="link plain" data-prev="${n}">${n}</button> ${glyph(g, true)}</span>`).join(" &nbsp; ")}</span></div>
      <div class="row" style="grid-template-columns:70px 1fr"><span class="sheet-field-label">Font</span><span>${live(pips(sp.font[2], sp.font[1], "sq", "Divine Font used"), 'Tracker field="divineFont" max="4"')} <button class="link plain" data-prev="${sp.font[0]}">${sp.font[0]}</button> ${glyph("◆–◆◆◆", true)} <span class="dim small">${sp.font[1] - sp.font[2]} left</span></span></div>
    </div>`; })() : "";
  const bulk = c.inv.reduce((s, [, b, q]) => s + (b === 0.1 ? 0 : b * q), 0), lights = c.inv.filter(([, b]) => b === 0.1).length;
  const inv = `<div class="strip small" style="margin:0 0 var(--d-gap)"${tag("Grid")}><span><span class="sheet-field-label">Bulk</span> <b>${bulk + Math.floor(lights / 10)}${lights % 10 ? `, ${lights % 10} L` : ""}</b> <span class="dim">/ ${5 + a.Str} (max ${10 + a.Str})</span></span>
      <span><span class="sheet-field-label">Invested</span> <b>${c.inv.filter(x => x[4]).length}</b> <span class="dim">/ 10</span></span>
      ${Object.entries(c.coins).map(([k, v]) => `<span><span class="sheet-field-label">${k}</span> ${E() ? `<input value="${v}" aria-label="${k}" style="width:40px;height:20px">` : `<b>${v}</b>`}</span>`).join("")}</div>
    <div class="rows inv"${tag("Table", 'field="inventory" item="Ref"')}><div class="row th"><span>Item</span><span>Qty</span><span>Bulk</span><span>State</span><span title="Invested">Inv</span></div>
    ${c.inv.map(([n, b, q, st, invd]) => `<div class="row"><button class="link plain" data-prev="${n}">${n}</button><span>${q}</span><span class="dim">${b === 0.1 ? "L" : b}</span><span class="small">${E() ? `<select aria-label="State" style="height:20px"><option>${st}</option></select>` : st}</span><span>${invd ? "✓" : ""}</span></div>`).join("")}
    ${E() ? `<div class="row"><button class="pick" style="justify-self:start">+ Add item</button></div>` : ""}</div>`;
  const bio = `<div class="kv" style="max-width:760px"${tag("Grid", 'columns="2"')}>${["Pronouns", "Age", "Appearance", "Personality", "Notes"].map(k => `<span class="sheet-field-label">${k}</span>${E() ? `<input aria-label="${k}" style="width:100%">` : `<span class="dim">—</span>`}`).join("")}</div>`;
  const T = { Class: klass, Feats: feats, ...(sp ? { Spells: spells } : {}), Inventory: inv, Biography: bio };
  if (!T[S.tab]) S.tab = "Class";
  const tabs = `<div${tag("Tabs")}><div class="tabs" role="tablist">${Object.keys(T).map(k => `<button role="tab" aria-selected="${k === S.tab}" data-tab="${k}">${ico(k)}${k}</button>`).join("")}</div>
    <div class="tabpanel" role="tabpanel">${T[S.tab]}</div></div>`;

  const el = document.getElementById("sheet");
  el.dataset.density = S.density;
  // Strikes and actions side by side at the same height in both layouts.
  el.innerHTML = head + top + `<div class="pair">${strikes}${actions}</div>` + (S.layout === "below"
    ? `<div class="mid"><div>${skills}</div><div>${profs}</div></div>` + tabs
    // Tabs right: skills and proficiencies beside the tabs.
    : `<div class="mid right"><div>${skills}${profs}</div><div>${tabs}</div></div>`);
  document.getElementById("preview").innerHTML = S.preview ? `<div class="preview" role="dialog" aria-label="${S.preview}"${tag("Ref", 'preview', "reference preview doesn't exist yet")}>
    <div style="display:flex;justify-content:space-between;gap:8px"><h3>${S.preview}</h3><button class="link" data-close>Close</button></div>
    <p class="small dim">Rules text from the imported content goes here: traits, actions, and the full description, read from the referenced resource.</p></div>` : "";
  document.body.classList.toggle("nogaps", S.gaps === "off");
  document.querySelectorAll("[data-ctl]").forEach(g => g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", S[g.dataset.ctl] === b.dataset.v)));
  contrast();
}
document.addEventListener("change", e => { if (e.target.matches('[aria-label="Initiative rolls with"]')) { PCS[S.pc].init = e.target.value; render(); } });
document.addEventListener("click", e => {
  const t = e.target;
  if (t.matches("[data-shield]")) { S.shieldUp = t.checked; return render(); }
  const b = t.closest("button"); if (!b) return;
  if (b.dataset.hpdo) { const c = PCS[S.pc], n = Math.max(0, parseInt(document.querySelector("[data-amt]").value) || 0);
    if (b.dataset.hpdo === "heal") c.hp = Math.min(c.hpMax, c.hp + n);
    else { const fromTemp = Math.min(c.temp, n); c.temp -= fromTemp; c.hp = Math.max(0, c.hp - (n - fromTemp)); }
    return render(); }
  const g = b.closest("[data-ctl]");
  if (g) S[g.dataset.ctl] = b.dataset.v;
  else if (b.dataset.add) { const list = PCS[S.pc][b.dataset.add], next = MORE[b.dataset.add].find(x => !list.some(y => y[1] === x[1])); if (next) list.push(next); }
  else if (b.dataset.tab) S.tab = b.dataset.tab;
  else if (b.dataset.open) S.open = S.open === b.dataset.open ? null : b.dataset.open;
  else if (b.dataset.prev) S.preview = b.dataset.prev;
  else if ("close" in b.dataset) S.preview = null;
  else if ("contrast" in b.dataset) { const box = document.getElementById("contrastbox"); box.hidden = !box.hidden; b.setAttribute("aria-expanded", !box.hidden); b.setAttribute("aria-pressed", !box.hidden); return; }
  else if (b.closest(".pips")) { b.classList.toggle("on"); return; }
  else return;
  render();
});

function rgb(v) { const d = document.createElement("div"); d.style.color = v; document.body.append(d); const m = getComputedStyle(d).color.match(/[\d.]+/g).map(Number); d.remove(); return m; }
function lum([r, g, b]) { return [r, g, b].map(x => { x /= 255; return x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; }).reduce((s, x, i) => s + x * [.2126, .7152, .0722][i], 0); }
function ratio(a, b) { const [x, y] = [lum(rgb(a)), lum(rgb(b))].sort((p, q) => q - p); return (x + .05) / (y + .05); }
function contrast() {
  const pairs = [["ink on panel", "--st-ink", "--st-panel", 4.5], ["muted on panel", "--st-ink-muted", "--st-panel", 4.5], ["muted on panel-muted", "--st-ink-muted", "--st-panel-muted", 4.5], ["primary on panel", "--st-primary", "--st-panel", 4.5],
    ["on-primary on primary", "--st-on-primary", "--st-primary", 4.5], ["error on panel", "--ui-error", "--st-panel", 3], ["border-strong on panel", "--st-border-strong", "--st-panel", 3]];
  document.getElementById("contrast").innerHTML = pairs.map(([n, f, b, min]) => { const r = ratio(`var(${f})`, `var(${b})`);
    return `<tr><td>${n}</td><td>${r.toFixed(2)}:1</td><td>${r >= min ? "pass" : "FAIL"} (≥ ${min})</td></tr>`; }).join("");
}
render();
</script>
</body>
</html>
