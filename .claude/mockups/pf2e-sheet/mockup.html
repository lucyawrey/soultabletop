<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PF2e Demo Sheet</title>
<script src="../_kit/app-theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
/* Sheet tokens, as app/assets/css/main.css maps them. */
:root {
  --st-page: var(--color-folio-100); --st-panel: var(--ui-bg); --st-panel-muted: var(--ui-bg-elevated);
  --st-ink: var(--ui-text-highlighted); --st-ink-muted: var(--ui-text-muted);
  --st-primary: var(--ui-primary); --st-on-primary: var(--ui-text-inverted); --st-accent: var(--ui-secondary);
  --st-border: var(--ui-border); --st-border-strong: var(--ui-border-accented);
  --st-radius: calc(var(--ui-radius) * 1.5);
  --st-font-body: var(--font-sans); --st-font-display: var(--font-display);
}
body { margin: 0; background: var(--st-page); color: var(--st-ink); font-family: var(--st-font-body); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--st-primary); outline-offset: 2px; }

/* Mockup chrome (not part of the sheet). */
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; background: var(--st-panel); border-bottom: 1px solid var(--st-border); position: sticky; top: 0; z-index: 5; }
.bar b { font-family: var(--st-font-display); font-size: 20px; }
.bar small { color: var(--st-ink-muted); }
.ctl { display: inline-flex; border: 1px solid var(--st-border-strong); border-radius: 6px; overflow: hidden; }
.ctl button { font-size: 13px; padding: 4px 10px; border: 0; background: transparent; cursor: pointer; }
.ctl button[aria-pressed="true"] { background: var(--st-primary); color: var(--st-on-primary); font-weight: 700; }
[data-gap] { outline: 2px dashed var(--ui-warning); outline-offset: 1px; }
body.nogaps [data-gap] { outline: 0; }

/* Density: the proposed built-in setting (one attribute on <Sheet>). */
.sheet[data-density="compact"] { --d-gap: 6px; --d-pad: 8px; --d-h: 24px; --d-fs: 13px; --d-lfs: 10.5px; --d-big: 22px; --d-hero: 30px; --d-h2: 15px; }
.sheet[data-density="roomy"]   { --d-gap: 16px; --d-pad: 16px; --d-h: 36px; --d-fs: 15px; --d-lfs: 12.5px; --d-big: 28px; --d-hero: 38px; --d-h2: 19px; }

.sheet { max-width: 1180px; margin: 0 auto; padding: calc(var(--d-gap) + 10px) var(--d-gap) var(--d-gap); display: grid; gap: calc(var(--d-gap) + 10px) var(--d-gap); font-size: var(--d-fs); }
/* Motif: section labels sit on the panel's top edge like folio tabs. */
.sheet-section { position: relative; background: var(--st-panel); border: 1px solid var(--st-border); border-radius: var(--st-radius); padding: calc(var(--d-pad) + 6px) var(--d-pad) var(--d-pad); min-width: 0; }
.sheet-section > h2 { position: absolute; top: 0; left: var(--d-pad); transform: translateY(-55%); margin: 0; font-family: var(--st-font-display); font-size: var(--d-h2); line-height: 1; padding: 3px 10px 4px; background: var(--st-panel); border: 1px solid var(--st-border-strong); border-bottom-color: var(--st-panel); border-radius: calc(var(--st-radius) * .8) calc(var(--st-radius) * .8) 0 0; }
.sheet-section > .aside { position: absolute; top: 0; right: var(--d-pad); transform: translateY(-50%); font-size: var(--d-lfs); color: var(--st-ink-muted); font-weight: 700; background: var(--st-panel); padding: 0 6px; }
.sheet-field-label { font-size: var(--d-lfs); color: var(--st-ink-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.sheet-field-value { font-weight: 700; font-variant-numeric: tabular-nums; }
input, select { font: inherit; color: var(--st-ink); height: var(--d-h); box-sizing: border-box; border: 1px solid var(--st-border-strong); border-radius: calc(var(--st-radius) * .66); background: var(--st-panel); padding: 0 6px; min-width: 0; }
.dim { color: var(--st-ink-muted); font-weight: 400; }
.small { font-size: var(--d-lfs); }
.chip { display: inline-block; font-size: var(--d-lfs); border: 1px solid var(--st-border); border-radius: 4px; padding: 0 4px; margin: 1px 2px 1px 0; color: var(--st-ink-muted); white-space: nowrap; }
.act { font-family: var(--st-font-body); color: var(--st-primary); font-weight: 700; letter-spacing: -1px; white-space: nowrap; }
.link { color: var(--st-primary); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.link.plain { color: var(--st-ink); }
.pick { border: 1px dashed var(--st-border-strong); border-radius: 4px; padding: 0 6px; color: var(--st-primary); background: var(--st-panel-muted); cursor: pointer; font-size: var(--d-lfs); font-weight: 700; }
.mod { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; background: none; border: 0; padding: 0 2px; cursor: pointer; border-bottom: 1px dotted var(--st-border-strong); }
.parts { grid-column: 1 / -1; font-size: var(--d-lfs); color: var(--st-ink-muted); background: var(--st-panel-muted); border-radius: 4px; padding: 2px 6px; }
.parts b { color: var(--st-ink); }
.rank { display: inline-grid; place-items: center; width: 20px; height: 17px; border-radius: 4px; font-size: 10.5px; font-weight: 700; border: 1px solid var(--st-border-strong); color: var(--st-ink-muted); }
.rank.t, .rank.e, .rank.m, .rank.l { background: var(--st-primary); color: var(--st-on-primary); border-color: var(--st-primary); }
select.rank-sel { width: 46px; height: calc(var(--d-h) - 4px); padding: 0 2px; font-size: var(--d-lfs); }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips button { width: 13px; height: 13px; border: 1.5px solid var(--st-primary); border-radius: 50%; background: transparent; padding: 0; cursor: pointer; }
.pips button.on { background: var(--st-primary); }
.pips.sq button { border-radius: 2px; }
.pips.bad button { border-color: var(--ui-error); } .pips.bad button.on { background: var(--ui-error); }

/* Header */
.head { display: grid; grid-template-columns: 1fr auto; gap: var(--d-gap) 20px; align-items: start; }
.head h1 { font-family: var(--st-font-display); font-size: calc(var(--d-big) * 1.35); margin: 0; line-height: 1; }
.refs { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; }
.ref { display: inline-flex; gap: 5px; align-items: baseline; border: 1px solid var(--st-border-strong); border-radius: 999px; padding: 1px 8px; background: var(--st-panel-muted); }
.meta { display: flex; border: 1px solid var(--st-border); border-radius: var(--st-radius); background: var(--st-panel-muted); }
.meta > div { display: grid; grid-template-rows: auto calc(var(--d-big) * 1.3); align-items: center; justify-items: center; gap: 2px; padding: calc(var(--d-pad) * .6) calc(var(--d-pad) + 6px); }
.meta > div + div { border-left: 1px solid var(--st-border); }
.meta .sheet-field-value { font-size: var(--d-big); line-height: 1; }
.meta .sheet-field-value.word { font-size: calc(var(--d-big) * .7); }
.meta .pips button { width: 17px; height: 17px; }
/* Desktop: the strip sits centered beside the name and chips, a bit larger. */
@media (min-width: 901px) {
  .head > .meta { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .head > .facts { grid-column: 1; }
  .meta > div { padding: calc(var(--d-pad) * .9) calc(var(--d-pad) + 14px); grid-template-rows: auto calc(var(--d-big) * 1.5); }
  .meta .sheet-field-value { font-size: calc(var(--d-big) * 1.15); }
  .meta .pips button { width: 19px; height: 19px; }
}
.facts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 14px; }

/* Defenses: hero numbers first, then the rest. */
.top { display: grid; grid-template-columns: auto 1fr; gap: var(--d-gap); align-items: stretch; }
.attrs { display: grid; grid-template-columns: repeat(3, 76px); grid-auto-rows: 1fr; gap: 6px; }
.attrs .box { padding: calc(var(--d-pad) * .6) 4px; }
.attrs .box .sheet-field-value { font-size: calc(var(--d-big) * 1.2); }
.attrs .box.key { border: 1px solid var(--st-primary); box-shadow: inset 0 0 0 1px var(--st-primary); }
.keytag { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; line-height: 1; padding: 2px 5px; border-radius: 3px; background: var(--st-primary); color: var(--st-on-primary); }
.box { border: 1px solid var(--st-border-strong); border-radius: var(--st-radius); padding: calc(var(--d-pad) * .45); text-align: center; background: var(--st-panel); display: grid; gap: 1px; align-content: center; position: relative; }
.box .sheet-field-value { font-size: var(--d-big); line-height: 1.05; }
.box .mod { font-size: var(--d-big); border-bottom: 0; text-align: center; }
.box.key { border: 2px solid var(--st-primary); }
.box input { width: 100%; text-align: center; font-weight: 700; }
.defs { display: grid; grid-template-columns: .9fr 2fr 1.2fr; gap: var(--d-gap); }
.saves { text-align: left; align-content: start; gap: 2px; }
.saves .srow { display: grid; grid-template-columns: 1fr auto 24px; align-items: center; gap: 6px; }
.saves .srow .mod { font-size: calc(var(--d-big) * .8); border-bottom: 1px dotted var(--st-border-strong); }
.saves .parts { margin-top: 2px; }
.hero-n .sheet-field-value, .hero-n .mod { font-size: var(--d-hero); }
.hp { text-align: left; grid-template-columns: 1fr auto; gap: 3px 8px; }
.hp .now { display: flex; align-items: baseline; gap: 4px; }
.hp .now input { width: 58px; height: calc(var(--d-hero) + 4px); font-size: var(--d-hero); font-weight: 700; }
.hp .max { font-size: calc(var(--d-hero) * .7); font-weight: 700; color: var(--st-ink-muted); }
.hp .hpline { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.hp .temp { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.hp .adj { display: flex; gap: 4px; align-items: center; }
.hp .adj input { width: 48px; text-align: center; }
.hp .adj button { height: var(--d-h); padding: 0 10px; border: 1px solid var(--st-border-strong); border-radius: calc(var(--st-radius) * .66); background: var(--st-panel); cursor: pointer; font-size: var(--d-lfs); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.hp .temp input { width: 48px; height: calc(var(--d-big) + 6px); font-size: var(--d-big); font-weight: 700; text-align: center; }
.meter { grid-column: 1 / -1; height: 6px; background: var(--st-panel-muted); border: 1px solid var(--st-border); border-radius: 3px; overflow: hidden; } .meter i { display: block; height: 100%; background: var(--st-primary); }
.death { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.box .parts { text-align: left; }
.strip { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin-top: var(--d-gap); }

/* Rows */
.rows { display: grid; }
.row { display: grid; align-items: center; gap: 6px; min-height: var(--d-h); border-bottom: 1px solid var(--st-border); padding: calc(var(--d-gap) * .3) 0; }
.row:last-child { border-bottom: 0; }
.row.th { min-height: 0; } .row.th > * { font-size: var(--d-lfs); color: var(--st-ink-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.row.untrained > span:first-child, .row.untrained .mod { color: var(--st-ink-muted); font-weight: 400; }
/* One row grid for both columns, so rows line up across them. */
.skills .cols2 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(var(--half), auto); grid-auto-flow: column; column-gap: calc(var(--d-gap) * 3); }
.skills .row { grid-template-columns: 1fr 30px 46px 42px; }
.skills .init { grid-template-columns: auto 1fr 42px; border-bottom: 2px solid var(--st-border-strong); margin-bottom: calc(var(--d-gap) * .5); }
.skills .lead > b { font-family: var(--st-font-display); font-size: var(--d-h2); }
.skills .lead .mod { font-size: calc(var(--d-big) * .8); }
.skills .init select { justify-self: end; width: auto; }

.strikes .row { grid-template-columns: 26px 1.1fr 118px 1fr 1.6fr; }
.strikes .dt { display: contents; }
.mapcell { font-size: var(--d-lfs); color: var(--st-ink-muted); white-space: nowrap; }
.acts .row { grid-template-columns: 52px 1fr auto; }
.pair { display: grid; grid-template-columns: 1.5fr 1fr; gap: calc(var(--d-gap) + 10px) var(--d-gap); align-items: stretch; }
.pair .row { min-height: calc(var(--d-h) + 12px); }
.pair .row:not(.th) .link { font-size: calc(var(--d-fs) + 1px); }
.mapcell { margin-left: 6px; word-spacing: 4px; }
.inv .row { grid-template-columns: 1fr 40px 40px 66px 30px; }
.mid { display: grid; grid-template-columns: 1.35fr 1fr; gap: calc(var(--d-gap) + 10px) var(--d-gap); align-items: start; }
.mid > div { display: grid; gap: calc(var(--d-gap) + 10px); }
/* Tabs right: skills keep one column of rows; the tabs take the wider side. */
.mid.right { grid-template-columns: minmax(300px, 1fr) 1.5fr; }
.mid.right .skills .cols2 { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; }
.mid.right .tabpanel { min-height: 640px; }
.feats { display: grid; gap: var(--d-gap); grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.feat { border-left: 3px solid var(--st-accent); padding-left: 6px; }
.feat .small { color: var(--st-ink-muted); display: block; }
.feat.empty { border-left-style: dashed; border-left-color: var(--st-border-strong); }
.profrows { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; align-items: center; }
.profrows > div { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; align-items: baseline; }

/* Tabs for the long lists. */
.tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: -1px; position: relative; }
.tabs button { padding: 4px 12px; border: 1px solid transparent; border-bottom: 0; background: transparent; color: var(--st-ink-muted); cursor: pointer; font-family: var(--st-font-display); font-size: var(--d-h2); font-weight: 700; border-radius: calc(var(--st-radius) * .8) calc(var(--st-radius) * .8) 0 0; }
.tabs button[aria-selected="true"] { background: var(--st-panel); border-color: var(--st-border-strong); color: var(--st-ink); }
.tabpanel { background: var(--st-panel); border: 1px solid var(--st-border-strong); border-radius: 0 var(--st-radius) var(--st-radius) var(--st-radius); padding: calc(var(--d-pad) * 1.5); min-height: 420px; }
/* Full-width tabs: wide panels split into columns. */
.tabcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: calc(var(--d-gap) * 2) calc(var(--d-gap) * 4); align-items: start; }
@media (max-width: 900px) { .tabpanel, .mid.right .tabpanel { min-height: 0; } .mid.right { grid-template-columns: 1fr; } }

/* Reference preview */
.preview { position: fixed; right: 16px; bottom: 16px; width: min(340px, calc(100vw - 32px)); background: var(--st-panel); border: 1px solid var(--st-border-strong); border-radius: var(--st-radius); box-shadow: 0 8px 24px rgb(0 0 0 / .15); padding: 12px; z-index: 6; }
.preview h3 { font-family: var(--st-font-display); font-size: 20px; margin: 0 0 4px; }

@media (max-width: 900px) {
  .top { grid-template-columns: 1fr; } .attrs { grid-template-columns: repeat(6, 1fr); }
  .defs { grid-template-columns: 1fr 1.3fr; grid-template-areas: "hp hp" "ac saves"; }
  .defs .ac { grid-area: ac; } .defs .hp { grid-area: hp; } .defs .saves { grid-area: saves; }
  .mid, .pair { grid-template-columns: 1fr; } .skills .cols2 { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; }
  .head { grid-template-columns: 1fr; } .meta { justify-content: start; }
  .strikes .row.th { display: none; }
  .strikes .row { grid-template-columns: 22px 1fr auto; row-gap: 0; }
  .strikes .dt { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; grid-column: 2 / -1; font-size: var(--d-lfs); }
}
.contrast { position: fixed; top: 52px; right: 16px; z-index: 6; font-size: 12px; color: var(--st-ink-muted); background: var(--st-panel); border: 1px solid var(--st-border-strong); border-radius: 6px; padding: 8px 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .15); }
.contrast[hidden] { display: none; }
.contrast td { padding: 1px 8px 1px 0; }
</style>
</head>

function contrast() {
  const pairs = [["ink on panel", "--st-ink", "--st-panel", 4.5], ["muted on panel", "--st-ink-muted", "--st-panel", 4.5], ["muted on panel-muted", "--st-ink-muted", "--st-panel-muted", 4.5], ["primary on panel", "--st-primary", "--st-panel", 4.5],
    ["on-primary on primary", "--st-on-primary", "--st-primary", 4.5], ["error on panel", "--ui-error", "--st-panel", 3], ["border-strong on panel", "--st-border-strong", "--st-panel", 3]];
  document.getElementById("contrast").innerHTML = pairs.map(([n, f, b, min]) => { const r = ratio(`var(${f})`, `var(${b})`);
    return `<tr><td>${n}</td><td>${r.toFixed(2)}:1</td><td>${r >= min ? "pass" : "FAIL"} (≥ ${min})</td></tr>`; }).join("");
}
render();
</script>
</body>
