# Edit values freely, but keep the keys as is (the app looks them up, and the tests fail if one is missing).
# Bracketed values like `{name}` are dynamically filled in by the app.
# Functional text (labels, buttons, errors) is directly in the components.

site:
  # Browser tab title and the description search engines and link previews show.
  title: Play and build tabletop RPGs | Soul Tabletop
  description: An open-source virtual tabletop for playing RPGs with friends, and building them too.

# The page at `/` for visitors who are signed out.
home:
  badge: Soul Tabletop
  heading: An open-source virtual tabletop for open gaming
  intro: >-
    Play tabletop RPGs with friends, online or around the table, using a large library of built-in content. Or make your own with support for custom game systems, content, and character sheets.
  # Under the form while registering and while signing in.
  registerNote: Join our community of players.
  signInNote: Get back to your games.

# The page at `/` once signed in.
dashboard:
  heading: Welcome back, {name}
  subheading: Pick up where you left off.
